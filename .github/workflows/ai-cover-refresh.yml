# =============================================================================
# ai-cover-refresh.yml
# -----------------------------------------------------------------------------
# PURPOSE
#   Manual, PR-scoped entry point to replace ONLY the cover image of an existing
#   AI-generated article pull request. It keeps the article Markdown and ledger
#   untouched, rewrites the cover prompt from the current draft + a short review
#   brief, regenerates static/images/<slug>/cover.png and pushes that single file
#   back to the same PR branch.
# =============================================================================

name: ai-cover-refresh

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del Pull Request cuyo cover.png quieres reemplazar."
        type: number
        required: true
      change_request:
        description: "Descripción corta de lo que quieres cambiar en la portada."
        type: string
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: read

concurrency:
  group: ai-cover-refresh-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AOAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
  AOAI_TEXT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT_TEXT }}
  AOAI_GENERATE_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT_TEXT_GENERATE || vars.AZURE_OPENAI_DEPLOYMENT_TEXT }}
  AOAI_IMAGE_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT_IMAGE }}
  AOAI_IMAGE_SIZE: "1792x1024"
  TOKEN_SCOPE: https://cognitiveservices.azure.com
  GH_APP_ID: ${{ vars.APP_ID }}

jobs:
  refresh-cover:
    name: Regenerar solo la portada del PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Azure login (OIDC, sin secretos)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del script
        run: python -m pip install --disable-pip-version-check --no-input -r automation/scripts/requirements.txt

      - name: Preservar las herramientas del workflow antes de cambiar de rama
        shell: bash
        run: |
          set -euo pipefail
          TOOL_DIR="${RUNNER_TEMP}/cover-refresh-tools"
          mkdir -p "${TOOL_DIR}"
          cp automation/scripts/refresh_cover_prompt.py "${TOOL_DIR}/"
          cp automation/scripts/generate_image.py "${TOOL_DIR}/"
          cp automation/scripts/_cover_style.py "${TOOL_DIR}/"
          cp automation/scripts/_foundry.py "${TOOL_DIR}/"

      - name: Mint GitHub App token (efímero)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolver la rama del PR y sus rutas
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          STATE="$(gh pr view "${PR_NUMBER}" --json state --jq .state)"
          if [ "${STATE}" != "OPEN" ]; then
            echo "The pull request must be open." >&2
            exit 1
          fi

          IS_CROSS_REPOSITORY="$(gh pr view "${PR_NUMBER}" --json isCrossRepository --jq .isCrossRepository)"
          if [ "${IS_CROSS_REPOSITORY}" = "true" ]; then
            echo "Cross-repository pull requests are not supported for cover refresh." >&2
            exit 1
          fi

          PR_BRANCH="$(gh pr view "${PR_NUMBER}" --json headRefName --jq .headRefName)"

          mapfile -t CHANGED_FILES < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename'
          )

          ARTICLE_FILES=()
          COVER_FILES=()
          for file in "${CHANGED_FILES[@]}"; do
            case "${file}" in
              content/posts/*.md) ARTICLE_FILES+=("${file}") ;;
              static/images/*/cover.png) COVER_FILES+=("${file}") ;;
            esac
          done

          if [ "${#ARTICLE_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one article Markdown file in the PR, found ${#ARTICLE_FILES[@]}." >&2
            exit 1
          fi

          ARTICLE_PATH="${ARTICLE_FILES[0]}"
          ARTICLE_FILE="$(basename "${ARTICLE_PATH}" .md)"
          SLUG="${ARTICLE_FILE#????-??-??-}"
          DERIVED_COVER_PATH="static/images/${SLUG}/cover.png"

          if [ "${#COVER_FILES[@]}" -gt 1 ]; then
            echo "Expected at most one cover.png in the PR, found ${#COVER_FILES[@]}." >&2
            exit 1
          fi
          if [ "${#COVER_FILES[@]}" -eq 1 ] && [ "${COVER_FILES[0]}" != "${DERIVED_COVER_PATH}" ]; then
            echo "The PR cover path does not match the article slug." >&2
            exit 1
          fi

          git fetch --quiet --no-tags origin "refs/heads/${PR_BRANCH}:refs/remotes/origin/${PR_BRANCH}"
          git checkout -B "${PR_BRANCH}" "origin/${PR_BRANCH}"

          if [ ! -f "${ARTICLE_PATH}" ]; then
            echo "The PR branch does not contain ${ARTICLE_PATH}." >&2
            exit 1
          fi

          mkdir -p "$(dirname "${DERIVED_COVER_PATH}")"

          {
            echo "pr_branch=${PR_BRANCH}"
            echo "article_path=${ARTICLE_PATH}"
            echo "cover_path=${DERIVED_COVER_PATH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Crear el brief revisado de portada
        shell: bash
        env:
          ARTICLE_PATH: ${{ steps.target.outputs.article_path }}
          COVER_REVIEW_BRIEF: ${{ inputs.change_request }}
          IMAGE_PROMPT_FILE: ${{ runner.temp }}/cover-refresh-prompt.txt
          COVER_PROMPT_TRACE_STDOUT: "true"
          COVER_REFRESH_TOOL_DIR: ${{ runner.temp }}/cover-refresh-tools
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource "${TOKEN_SCOPE}" --query accessToken --output tsv --only-show-errors)"
          AOAI_TOKEN="${TOKEN}" python "${COVER_REFRESH_TOOL_DIR}/refresh_cover_prompt.py"

      - name: Regenerar solo cover.png
        shell: bash
        env:
          IMAGE_TRACE_STDOUT: "true"
          IMAGE_PROMPT_FILE: ${{ runner.temp }}/cover-refresh-prompt.txt
          COVER_PATH: ${{ steps.target.outputs.cover_path }}
          COVER_REFRESH_TOOL_DIR: ${{ runner.temp }}/cover-refresh-tools
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource "${TOKEN_SCOPE}" --query accessToken --output tsv --only-show-errors)"
          AOAI_TOKEN="${TOKEN}" python "${COVER_REFRESH_TOOL_DIR}/generate_image.py"

      - name: Confirmar y subir solo la portada
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_BRANCH: ${{ steps.target.outputs.pr_branch }}
          COVER_PATH: ${{ steps.target.outputs.cover_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${COVER_PATH}"
          if git diff --cached --quiet -- "${COVER_PATH}"; then
            echo "The regenerated cover is identical to the current one; nothing to push." >&2
            exit 1
          fi

          git commit -m "fix - content: refresh cover for PR #${PR_NUMBER}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${PR_BRANCH}"
