# =============================================================================
# PLANTILLA / EJEMPLO — el escáner de temas IGNORA este archivo.
#
# Motivo: su nombre empieza por "_" (guion bajo). Convención del ledger:
# cualquier fichero "automation/topics/_*.yaml" se trata como plantilla o
# ejemplo y NO se procesa.
#
# Para crear un tema real, copia este archivo a "automation/topics/<id>.yaml"
# (sin guion bajo) y rellena los campos con valores reales.
# =============================================================================

# Identificador único y estable del tema. Se usa como nombre de archivo
# (<id>.yaml) y como clave primaria del ledger. Formato kebab-case.
id: dotnet-aspire-observabilidad-opentelemetry

# Título de trabajo en inglés. Junto con el slug forma parte de la clave de
# deduplicación EXACTA; el título final en español se genera al redactar.
title: "Observability in .NET Aspire with OpenTelemetry"

# Slug del artículo (kebab-case, ASCII). Al entrar en revisión se sustituye por
# el slug final generado. También forma parte de la deduplicación EXACTA (clave a).
slug: dotnet-aspire-observabilidad-opentelemetry

# Clasificación editorial del tema. Valores permitidos:
#   technical -> el lector puede reproducirlo con código, configuración o
#                comandos reales; la generación EXIGE >=2 ejemplos de código
#                reales y ejecutables (gate determinista en generate_article.py).
#   business  -> anuncio, estrategia, opinión o análisis; exento de código.
# Si falta o el valor no es válido, el pipeline lo trata como "business"
# (fail-closed: nunca se exige código a un tema sin clasificar).
article_type: technical

# Área de cobertura editorial detectada en el descubrimiento (metadato interno,
# en inglés; coincide con una de las áreas del prompt de descubrimiento).
area: ".NET and C# (runtime, ASP.NET Core, .NET Aspire, performance, upgrades)"

# Solo para temas "technical": de 1 a 3 ideas concretas de ejemplos prácticos,
# fundamentadas en las fuentes, que la generación desarrolla como código real.
code_example_ideas:
  - "Configure the OpenTelemetry exporters in a .NET Aspire AppHost and inspect the traces in the dashboard"
  - "Correlate a failing HTTP request across services using the Aspire trace view"

# Estado del tema dentro del ciclo de vida. Valores permitidos:
#   candidate  -> descubierto, todavía sin validar
#   queued     -> aprobado y en cola para generación
#   in_review  -> hay un PR abierto, pendiente de revisión humana
#   published  -> publicado (existe el .md correspondiente en content/posts/)
#   rejected   -> descartado (sin valor editorial / fuera de alcance)
#   parked     -> aparcado temporalmente (se podrá retomar más adelante)
status: candidate

# Historial append-only de transiciones. Conserva también los estados que se
# producen en el runner antes del primer commit del fichero.
status_history:
  - status: candidate
    at: 2026-06-23T10:28:05+02:00

# Marca temporal de descubrimiento en formato ISO 8601 (con zona horaria).
discovered_at: 2026-06-23T10:28:05+02:00

# Fuentes validadas para redacción e imágenes. La primaria ocupa el primer lugar.
sources:
  - url: https://learn.microsoft.com/dotnet/aspire/fundamentals/telemetry
    title: ".NET Aspire telemetry"
    published_date: null
    host: learn.microsoft.com
    kind: primary

# Resultado de la deduplicación SEMÁNTICA (clave b), calculada con embeddings.
similarity:
  # Máxima similitud (coseno, 0..1) frente a temas publicados, encolados o en revisión.
  max_score: 0.71
  # id o slug del tema más parecido encontrado (la "coincidencia más cercana").
  closest_match: integrando-otros-llms-con-semantic-kernel
  # Umbral de novedad. Si max_score es MAYOR que este umbral, el tema se
  # considera "demasiado parecido" y se omite. Valor por defecto: 0.82.
  threshold: 0.82

# Notas libres para personas: contexto, ángulo editorial, recordatorios, etc.
notes: "Centrar el artículo en el panel de Aspire y la correlación de trazas; evitar solapamiento con el artículo de Semantic Kernel."

# Ruta exacta del post generado, incluido el prefijo de fecha. Permanece null
# hasta que el artículo entra en revisión.
article_path: null

# URL del Pull Request asociado. Se persiste al publicar.
pr_url: null
