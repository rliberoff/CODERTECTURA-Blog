    # ExpressRoute routing requirements

    To connect to Microsoft cloud services by using ExpressRoute, you need to set
    up and manage routing. Some connectivity providers offer setting up and managing
    routing as a managed service. Check with your connectivity provider to see if
    they offer this service. If they don''t, you must adhere to the following requirements.

    For a description of the routing sessions that you need to set up to facilitate
    connectivity, see [Circuits and routing domains](expressroute-circuit-peerings).

    Note

    Microsoft doesn''t support any router redundancy protocols, such as HSRP or VRRP,
    for high availability configurations. Microsoft relies on a redundant pair of
    BGP sessions per peering for high availability.

    ## IP addresses used for peering

    You need to reserve a few blocks of IP addresses to configure routing between
    your network and Microsoft''s Enterprise edge (MSEEs) routers. This section provides
    a list of requirements and describes the rules regarding how you must acquire
    and use these IP addresses.

    ### IP addresses used for Azure private peering

    You can use either private IP addresses or public IP addresses to configure the
    peering. The address range you use for configuring routes can''t overlap with
    address ranges used for virtual networks in Azure.

    * IPv4:

    + Reserve a `/29` subnet or two `/30` subnets for routing interfaces.

    + Use either private IP addresses or public IP addresses for the subnets used
    for routing.

    + The subnets must not conflict with the range reserved by the customer for use
    in the Microsoft cloud.

    + If you use a `/29` subnet, split it into two `/30` subnets.

    - Use the first `/30` subnet for the primary link and the second `/30` subnet
    for the secondary link.

    - For each of the `/30` subnets, use the first IP address of the `/30` subnet
    for your router. Microsoft uses the second IP address of the `/30` subnet to set
    up a BGP session.

    - You must set up both BGP sessions for the [availability SLA](https://azure.microsoft.com/support/legal/sla/)
    to be valid.

    * IPv6:

    + Reserve a `/125` subnet or two `/126` subnets for routing interfaces.

    + Use either private IP addresses or public IP addresses for the subnets used
    for routing.

