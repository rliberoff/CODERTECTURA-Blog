    # Azure virtual network peering

    Azure Virtual Network peering enables you to seamlessly connect two or more virtual
    networks in Azure, making them appear as one for connectivity purposes. This powerful
    feature allows you to create secure, high-performance connections between virtual
    networks while keeping all traffic on Microsoft''s private backbone infrastructure,
    eliminating the need for public internet routing.

    **What you''ll learn in this article:**

    * How virtual network peering works and its key benefits

    * Different types of peering (local and global)

    * How to implement connectivity and service chaining

    * Troubleshooting common peering issues

    Whether you''re designing a hub-and-spoke topology or connecting networks across
    regions, this guide helps you understand the capabilities and limitations of virtual
    network peering.

    By default, a virtual network is peered with up to 500 other virtual networks.
    By using the [connectivity configuration for Azure Virtual Network Manager](../virtual-network-manager/concept-connectivity-configuration),
    you can increase this limit to peer up to 1,000 virtual networks to a single virtual
    network. With this larger size, you can create a hub-and-spoke topology with 1,000-spoke
    virtual networks, for example. You can also create a mesh of 1,000-spoke virtual
    networks where all spoke virtual networks are directly interconnected.

    Azure supports the following types of peering:

    * **Virtual network peering**: Connect virtual networks within the same Azure
    region.

    * **Global virtual network peering**: Connect virtual networks across Azure regions.

    The benefits of using virtual network peering, whether local or global, include:

    * A low-latency, high-bandwidth connection between resources in different virtual
    networks.

    * The ability for resources in one virtual network to communicate with resources
    in a different virtual network.

    * The ability to transfer data between virtual networks across Azure subscriptions,
    Microsoft Entra tenants, deployment models, and Azure regions.

    * The ability to peer virtual networks created through Azure Resource Manager.

    * The ability to peer a virtual network created through Resource Manager to one
    created through the classic deployment model. To learn more about Azure deployment…'
