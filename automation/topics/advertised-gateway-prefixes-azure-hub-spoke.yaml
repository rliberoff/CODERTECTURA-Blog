  excerpt: 'Introduction Large Azure hub-and-spoke environments can advertise a significant
    number of routes toward on-premises networks. By default, Azure VPN Gateway and
    ExpressRoute Gateway advertise the address spaces of the hub virtual network and
    the address spaces of peered spoke virtual networks that use gateway transit.
    As the number of spokes and address spaces grows, the border gateway protocol
    (BGP) route table grows as well. Advertised gateway prefixes provide a native
    way to summarize those Azure-side routes. The feature is configured on the hub
    virtual network through the summarizedGatewayPrefixes property, which is exposed
    in the Azure portal as Advertised gateway prefixes . Fewer BGP prefixes Replace
    many individual networks with one or more aggregated CIDRs. Better scale management
    Help large hub-and-spoke designs stay within advertised-prefix limits. Cleaner
    route visibility Make the intended Azure address plan easier to recognize on provider
    and on-premises route views. In this blog we will demonstrate leveraging Advertised
    gateway prefixes to summarize many Azure advertised prefixes into one. What are
    advertised gateway prefixes? Advertised gateway prefixes are summarized CIDR blocks
    that an Azure hybrid gateway advertises toward on-premises instead of advertising
    every covered hub and spoke address space individually. The configuration belongs
    on the gateway virtual network, usually the hub VNet that contains GatewaySubnet
    and the ExpressRoute or VPN gateway. How the route advertisement changes Default
    behavior With advertised gateway prefixes Hub: 10.27.0.0/24 Spoke 1: 10.27.1.0/24
    Spoke 2: 10.27.2.0/24 Spoke 3: 10.27.3.0/24 Summary: 10.27.0.0/22 Four individual
    prefixes are advertised. One summary prefix is advertised. A spoke outside the
    summary is still advertised separately. Example: 172.16.1.0/24 remains visible
    if it is not covered by 10.27.0.0/22. When should you use it? You use a hub-and-spoke
    topology with gateway transit and many spoke address spaces. You want to advertise
    a covering prefix, such as a /16, instead of many smaller prefixes, such as multiple
    /24 networks. You are approaching ExpressRoute advertised-prefix limits or want
    to reduce route-table growth before scale becomes a problem. Your Azure address
    plan is sufficiently structured to create safe, intentional summary ranges. Note:
    ExpressRoute scale context: Microsoft documentation lists a maximum of 1,000 IPv4
    prefixes and 100 IPv6 prefixes advertised from a virtual network to on-premises
    on a single ExpressRoute connection through private peering. Exceeding the connection
    prefix limit can cause the connection between the circuit and gateway to disconnect
    until the prefix count is reduced. Prerequisites A hub virtual network with GatewaySubnet.
    An ExpressRoute gateway or VPN gateway deployed in the hub virtual network. One
    or more peered spoke virtual networks if you want to demonstrate route summarization
    across spokes. A planned IPv4 and, when applicable, IPv6…'
