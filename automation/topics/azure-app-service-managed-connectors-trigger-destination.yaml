  excerpt: 'Azure Managed Connectors, currently in public preview, now lets you choose
    Azure App Service as a trigger destination . Connector events can be delivered
    directly to applications running on App Service, including ASP.NET Core, Java,
    Node.js, and Python applications. This is a new capability in the Managed Connectors
    public preview . It is not the announcement of a separate App Service preview.
    What''s new When you create a trigger in the Managed Connectors portal, App Service
    now appears as a first-class destination alongside Azure Functions and the generic
    HTTP endpoint option. After selecting an existing App Service app, you configure:
    The application route that receives the event. New triggers default to POST /api/webhook
    , and the route can be edited. The Connector Namespace managed identity used to
    authenticate the callback. The Microsoft Entra audience expected by the receiving
    application. Managed Connectors then records the selected App Service resource,
    route, managed identity, and audience as part of the trigger configuration. You
    no longer need to select the generic HTTP destination and manually assemble the
    App Service callback URL. What are managed connectors? Managed connectors provide
    a consistent way for applications to integrate with services such as Office 365,
    SharePoint, Teams, Dataverse, and Salesforce. A Connector Namespace manages connections
    and connector operations so developers do not need to build a separate OAuth flow
    and service-specific client for every integration. Managed connectors support
    both directions: Triggers deliver events to your application, such as a new Outlook
    email or a file added to SharePoint. Actions let your application call operations
    such as posting a Teams message, flagging an email, or creating a list item. The
    App Service destination makes the trigger side a first-class option for existing
    web applications and APIs. How it works In the Managed Connectors portal, create
    a trigger and select App Service as its destination. Select the web app, callback
    route, Connector Namespace managed identity, and Microsoft Entra audience. When
    the source event occurs, Managed Connectors requests a token using the selected
    managed identity and sends the event to the App Service route. App Service built-in
    authentication validates the token before the request reaches application code.
    The application processes the event and can use Managed Connectors actions to
    continue the workflow. The callback is an ordinary authenticated HTTP request,
    so the application can use its normal framework, routing, dependency injection,
    logging, monitoring, and deployment practices. Configure receiving-app authentication
    The App Service destination configures the Managed Connectors side of the callback.
    The receiving application must still be configured to trust it. The reference
    sample uses App Service built-in authentication, also known as Easy Auth, with:
    A Microsoft Entra application that identifies the receiving application a…'
