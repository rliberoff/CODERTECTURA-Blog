    # Use managed connectors in Azure Functions

    ## In this article

    By using managed connectors, your functions can react to events and call operations
    in services like Microsoft 365, Microsoft Teams, SharePoint, and many third-party
    systems without writing webhook setup code or managing OAuth tokens. Azure Functions
    integrates with Azure Connector Namespace to provide a trigger and an SDK that
    lets you focus on business logic while the connector namespace handles webhooks,
    authentication, and retries.

    Note

    Azure Connector Namespace integration for Azure Functions is currently in public
    preview. Features, configuration names, and support for specific managed connectors
    can change before general availability (GA). Use of this feature is subject to
    the [supplemental terms of use for Microsoft Azure previews](https://azure.microsoft.com/support/legal/preview-supplemental-terms/).

    Only C#, Node.js, and Python language stacks are currently supported.

    ## How connectors enhance Functions

    A connector namespace adds two capabilities to the Functions programming model:

    `connectorTrigger`

    You can use managed connectors alongside classic Functions triggers and bindings
    such as HTTP, timer, queue, Service Bus, Event Grid, and Durable Functions.

    ## Preview availability

    | Dimension | Availability |

    | --- | --- |

    | **Connector Namespace region** | West Central US (`westcentralus`). Function
    app can be in any supported region. |

    | **Languages** | .NET 10/.NET 8 isolated, Python 3.13+, Node.js 22+ (JS/TS).
    Java, PowerShell, and Go aren''t supported. |

    | **Hosting plans** | [Flex Consumption](flex-consumption-plan) (recommended),
    [Premium](functions-premium-plan), [Dedicated](dedicated-plan), and [Container
    Apps](functions-container-apps-hosting). |

    | **Pricing** | [Standard Functions pricing](https://azure.microsoft.com/pricing/details/functions/):
    No extra charge for connector trigger/SDK during preview. *Connector Namespace
    has separate billing.* |

    `westcentralus`

    ## When to use connectors

    Use connectors when your functions mainly need to interact with external services
    rather than run complex custom logic. Consider these ways to use managed connectors
    in your function apps:

    **React to external events**

    Your app must handle events raised by externally connected services (new emails,
    calendar invites, files, list items, Teams activity), but you don''t want to spend
    the effort coding webhook registrations, handshake validation, and OAuth refreshes.
