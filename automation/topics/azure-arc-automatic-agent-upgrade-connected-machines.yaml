    # Manage Azure Connected Machine agent versions for Azure Arc-enabled servers

    After you deploy the Azure Connected Machine agent, you might need to reconfigure,
    upgrade, remove, or make other changes to the agent. You can perform these routine
    maintenance tasks manually. You can also enable [automatic agent upgrades (preview)](#enable-automatic-agent-upgrade-preview)
    or explore other options to automate tasks, which reduces operational error and
    expenses.

    The Azure Connected Machine agent is updated regularly to address bug fixes, stability
    enhancements, and new functionality. [Azure Advisor](/en-us/azure/advisor/advisor-overview)
    identifies resources that aren''t using the latest version of the machine agent
    and recommends that you upgrade to the latest version. It notifies you when you
    select the Azure Arc-enabled server by presenting a banner on the **Overview**
    page, or when you access Advisor through the Azure portal.

    You can upgrade the Azure Connected Machine agent for Windows and Linux to the
    latest release manually or automatically, depending on your requirements. You
    don''t need to restart your server when you install, upgrade, or uninstall the
    Azure Connected Machine Agent.

    This article describes how to perform various operations related to the Connected
    Machine agent and your Arc-enabled servers.

    Tip

    For command line reference information, see the [`azcmagent` CLI documentation](azcmagent).

    ## Install a specific version of the agent

    We recommend that you always use the [most recent version](agent-release-notes)
    of the Azure Connected Machine agent. However, if you need to run an older version
    of the agent for some reason, uninstall the current version and then install the
    target version. If your machine is already connected to Azure Arc, you don''t
    need to disconnect the machine. The product group officially supports only Connected
    Machine [agent versions released within the last year](agent-release-notes).

    Follow these instructions to install a specific version of the Azure Connected
    Machine agent.

    * [Windows](#tabpanel_1_windows)

    * [Linux - apt](#tabpanel_1_linux-apt)

    * [Linux - yum](#tabpanel_1_linux-yum)

    * [Linux - zypper](#tabpanel_1_linux-zypper)

