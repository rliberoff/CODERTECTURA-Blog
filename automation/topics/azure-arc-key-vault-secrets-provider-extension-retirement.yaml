    ## Blog Post

    # GA: Azure Key Vault secrets provider extension for Arc enabled Kubernetes clusters

    ![Mayuri_Gupta''s avatar](https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/dS0xMDQxMjA2LVNxVWZ6NA?image-coordinates=199%2C0%2C1800%2C1600&image-dimensions=50x50)

    ![Icon for Microsoft rank](https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/cmstNC05WEo0blc?image-dimensions=100x16&constrain-image=true)

    The Azure Arc team is happy to announce the GA of Azure Key Vault Secrets Provider
    extension for [Arc enabled Kubernetes](https://aka.ms/arc-osm-k8s) clusters. This
    is a Microsoft managed extension that allows you to get secret contents stored
    in an [Azure Key Vault](https://docs.microsoft.com/en-us/azure/key-vault/general/overview)
    instance and mount them into Kubernetes pods of your Azure Arc enabled Kubernetes
    clusters, thereby reducing the exposure of secrets to the minimum. It can pull
    any type of object from an Azure Key Vault, including keys, secrets and certificates.

    The extension is installed by a cluster admin. With the installation, Secrets
    Store CSI driver and AKV secrets provider are deployed as daemon sets. On application
    pod start and restart, the Secrets Store CSI driver communicates with the Azure
    Key Vault secrets provider using gRPC to retrieve the secret content from the
    Azure Key Vault. Then the volume is mounted in the pod as `tmpfs` and the secret
    contents are written to the volume. On pod delete, the corresponding volume is
    cleaned up and deleted.

    `tmpfs`

    ![CSI driver Interface.png](https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS0zMzg5MjMxLTM3MjQ2OWkyNzZBNkJBRUU3MTFFNjQy?image-dimensions=999x384&revision=4)

    ![CSI driver Interface.png](https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS0zMzg5MjMxLTM3MjQ2OWkyNzZBNkJBRUU3MTFFNjQy?image-dimensions=999x384&revision=4)

    This extension can be deployed using az k8s-extension CLI and also using Azure
    Portal. For deployment through portal, go to the Arc connected Kubernetes cluster
    and click on **Extensions** under Settings. Further, click on **+Add** to add
    Azure Key Vault Secrets Provider extension. Check out the [full documentation](https://aka.ms/arc-akv-secrets-provider)
    on how to enable it for an Arc enabled Kubernetes cluster.

    The extension allows for 3 configuration options:

    A service principal is required to enable the access to Azure Key Vault from within
    the Arc cluster. Further, a Kubernetes secret needs to be created in the application
    namespace that references this service principal in order to gain access to the
    vault.

    What next?

    The identity option available today is service principal. However, we are investing
    in using workload identity as another option in future.

    Learn more at the Azure Hybrid, Multicloud, and Edge Day digital event

