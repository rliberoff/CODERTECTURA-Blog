    # Use the Secret Store extension to fetch secrets for offline access in Azure
    Arc-enabled Kubernetes clusters

    ## In this article

    The Azure Key Vault Secret Store extension for Kubernetes (SSE) automatically
    synchronizes secrets from an [Azure Key Vault](/en-us/azure/key-vault/general/overview)
    to an [Azure Arc-enabled Kubernetes cluster](overview) for offline access. This
    means you can use Azure Key Vault to store, maintain, and rotate your secrets,
    even when running your Kubernetes cluster in a semi-disconnected state. Synchronized
    secrets are stored in the cluster [secret store](https://Kubernetes.io/docs/concepts/configuration/secret/),
    making them available as Kubernetes secrets to be used in all the usual ways:
    mounted as data volumes, or exposed as environment variables to a container in
    a pod.

    Synchronized secrets are critical business assets, so the SSE secures them through
    isolated namespaces, role-based access control (RBAC) policies, and limited permissions
    for the synchronization controller. For extra protection, [encrypt](https://Kubernetes.io/docs/tasks/administer-cluster/encrypt-data/)
    the Kubernetes secret store on your cluster.

    This article shows you how to install and configure the SSE as an [Azure Arc-enabled
    Kubernetes extension](conceptual-extensions).

    Tip

    The SSE is recommended for clusters outside of Azure cloud where connectivity
    to Azure Key Vault may not be perfect. SSE by its nature creates copies of your
    secrets in the Kubernetes secrets store. If you prefer to avoid creating local
    copies of secrets and your cluster has perfect connectivity to Azure Key Vault,
    then you can use the online-only [Azure Key Vault Secrets Provider extension](tutorial-akv-secrets-provider)
    for secret access in your Arc-enabled Kubernetes clusters. It is not recommended
    to run both the online Azure Key Vault Secrets Provider extension and the offline
    SSE side-by-side in the same cluster.

