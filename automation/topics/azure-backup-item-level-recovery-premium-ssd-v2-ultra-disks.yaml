    # About Azure PostgreSQL flexible server and elastic cluster vaulted backup (v2)
    (preview)

    **Azure Backup for PostgreSQL Flexible Server and Elastic Cluster v2 (preview)**
    provides an enhanced backup capability designed to address key limitations of
    the existing v1 solution and supports a broader range of backup needs. V2 uses
    physical backups based on managed disk snapshots, replacing the logical `pg_dump`
    backup approach used in v1.

    ## Why use Azure PostgreSQL flexible server and elastic cluster vaulted backup
    (v2)

    The v2 backup solution provides greater flexibility for protecting and recovering
    Azure PostgreSQL Flexible Server or Elastic Cluster workloads. It uses incremental
    snapshots of the underlying managed disks instead of the logical backup approach
    used by v1, addressing limitations related to server size, backup frequency, and
    recovery options.

    The following table compares the capabilities available with v1 and v2 backup.

    | Capability | v1 (generally available) | v2 (preview) |

    | --- | --- | --- |

    | Backup technology | Logical backup (`pg_dump`) | Physical backup from managed
    disk snapshots |

    | Datasources protected | Flexible server | Flexible server and elastic cluster
    |

    | Maximum size | 1 TB | 32 TB on Premium SSD v1; 64 TB on Premium SSD v2 |

    | Backup frequency | One backup per week | Daily and weekly schedules (1-day RPO)
    |

    | Backup type | Full backups only | First backup is full; subsequent backups are
    incremental |

    | Restore | Restore as files to a storage container, then import with native tools
    | Restore as server directly to a target flexible server or elastic cluster |

    | Maximum retention | Up to 10 years | Up to 10 years |

    ## Key capabilities of Azure PostgreSQL flexible server and elastic cluster vaulted
    backup (v2)

    This feature includes the following key capabilities:

    * **Vaulted, isolated long-term backups:** Takes snapshots in your tenant and
    streams backups to the Backup vault. This capability isolates the backup data
    from the source subscription and account. The vault protects the data with Azure
    role-based access control (RBAC), [soft delete](secure-by-default), and [Multi-user
    authorization](multi-user-authorization-concept) (if enabled).

