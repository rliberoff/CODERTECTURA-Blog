    # Retirement of Azure Communication Services

    Microsoft has announced several retirement and breaking changes in September 2026.

    One notable change is the retirement of **Azure Communication Services as a standalone
    offering**, scheduled to take effect on **September 30, 2028**.

    Organizations currently using Azure Communication Services should review the announcement,
    assess the potential impact on their environments, and begin planning accordingly.

    <https://learn.microsoft.com/en-us/azure/communication-services/acs-retirement-and-breaking-changes-guide>

