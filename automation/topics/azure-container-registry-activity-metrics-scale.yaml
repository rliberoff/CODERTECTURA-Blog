    # Monitor Azure Container Registry

    This article describes:

    * The types of monitoring data you can collect for this service.

    * Ways to analyze that data.

    Note

    If you''re already familiar with this service and/or Azure Monitor and just want
    to know how to analyze monitoring data, see the [Analyze](#analyze-monitoring-data)
    section near the end of this article.

    When you have critical applications and business processes that rely on Azure
    resources, you need to monitor and get alerts for your system. The Azure Monitor
    service collects and aggregates metrics and logs from every component of your
    system. Azure Monitor provides you with a view of availability, performance, and
    resilience, and notifies you of issues. You can use the Azure portal, PowerShell,
    Azure CLI, REST API, or client libraries to set up and view monitoring data.

    * For more information on Azure Monitor, see the [Azure Monitor overview](/en-us/azure/azure-monitor/overview).

    * For more information on how to monitor Azure resources in general, see [Monitor
    Azure resources with Azure Monitor](/en-us/azure/azure-monitor/essentials/monitor-azure-resource).

    This article describes the monitoring data generated by Azure Container Registry
    and how you can use the features of Azure Monitor to analyze and alert on this
    data.

    ## Monitor overview

    The **Overview** page in the Azure portal for each registry includes a brief view
    of recent resource usage and activity, such as push and pull operations. This
    high-level information is useful, but only a small amount of data is shown there.

    For customizable visualizations and more detailed analysis, open **Dashboards
    with Grafana** under **Monitoring**. This integrated experience, enabled by Azure
    Managed Grafana, includes Azure-managed dashboards for transaction trends, data
    transfer, throttling, and storage consumption. You can also create, customize,
    save, and share dashboards without deploying a separate Grafana instance. For
    more information, see [Grafana dashboards in Azure Container Registry](/en-us/azure/container-registry/container-registry-dashboards-with-grafana).

    ![Screenshot shows the registry metrics overview page displaying four metrics
    over the last 30 days.](media/monitor-service/metrics-overview.png)

