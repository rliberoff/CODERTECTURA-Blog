    # Azure Container Registry monitoring data reference

    This article contains all the monitoring reference information for this service.

    See [Monitor Azure Container Registry](monitor-container-registry) for details
    on the data you can collect for Azure Container Registry and how to use it.

    ## Metrics

    This section lists all the automatically collected platform metrics for this service.
    These metrics are also part of the global list of [all platform metrics supported
    in Azure Monitor](/en-us/azure/azure-monitor/reference/supported-metrics/metrics-index#supported-metrics-per-resource-type).

    For information on metric retention, see [Azure Monitor Metrics overview](/en-us/azure/azure-monitor/essentials/data-platform-metrics#retention-of-metrics).

    ### Supported metrics for Microsoft.ContainerRegistry/registries

    The following table lists the metrics available for the Microsoft.ContainerRegistry/registries
    resource type.

    * All columns might not be present in every table.

    * Some columns might be beyond the viewing area of the page. Select **Expand table**
    to view all available columns.

    **Table headings**

    * **Category** - The metrics group or classification.

    * **Metric** - The metric display name as it appears in the Azure portal.

    * **Name in REST API** - The metric name as referred to in the [REST API](/en-us/azure/azure-monitor/essentials/rest-api-walkthrough).

    * **Unit** - Unit of measure.

    * **Aggregation** - The default [aggregation](/en-us/azure/azure-monitor/essentials/metrics-aggregation-explained)
    type. Valid values: Average (Avg), Minimum (Min), Maximum (Max), Total (Sum),
    Count.

    * **Dimensions** - [Dimensions](/en-us/azure/azure-monitor/essentials/metrics-aggregation-explained#dimensions-splitting-and-filtering)
    available for the metric.

    * **Time Grains** - [Intervals](/en-us/azure/azure-monitor/essentials/metrics-aggregation-explained#granularity)
    at which the metric is sampled. For example, `PT1M` indicates that the metric
    is sampled every minute, `PT30M` every 30 minutes, `PT1H` every hour, and so on.

    * **DS Export**- Whether the metric is exportable to Azure Monitor Logs via diagnostic
    settings. For information on exporting metrics, see [Create diagnostic settings
    in Azure Monitor](/en-us/azure/azure-monitor/…'
