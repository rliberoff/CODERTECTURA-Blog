  excerpt: 'Learn More Use Grafana dashboards in Azure Container Registry Monitor
    Azure Container Registry Azure Container Registry (ACR) now publishes two new
    metrics: Transactions and Data Transfer . For the first time, you can see which
    operations your registry serves, which region serves them, and how much data (egress)
    they move, for each registry and each of its geo-replicas. ACR often serves as
    a shared distribution point for containerized workloads. Build systems push container
    images and other artifacts, Kubernetes clusters pull images during deployments,
    and security and lifecycle tools scan artifacts throughout the day. As those environments
    grow, high-level signals such as a total pull count or storage used can tell you
    that activity changed, but not why . Transactions and Data Transfer fill that
    gap, so you can explain a traffic spike, catch a failing or throttled pipeline,
    and see where your data goes. A customer-facing metric is a stream of data points,
    attributed to one resource, that you can chart, split, and alert on in Azure Monitor.
    Building these metrics meant producing data points for very high-throughput signals,
    counting them accurately, attributing each one to the right registry in every
    region, and not exhausting the metrics system underneath. In this post, we''ll
    cover what these metrics show you, what it took to deliver them at scale, and
    the sharded design that made it possible. What you couldn''t see before Before
    this work, push and pull counts, alongside storage used, were the only registry
    traffic metrics we published. They showed that activity happened, but not what
    kind of operations drove it, whether each operation succeeded, or where it was
    served. Take a sudden jump in pulls: Before: total pull count is up, with no way
    to tell which geo-replication drove the traffic. Now: the extra requests are blob
    downloads in one geo-replication region, many of them Throttled, while Data Transfer
    from that geo-replication stays flat. Those gaps matter most when traffic changes.
    An increase may come from a deployment, a retry loop, metadata polling, a regional
    workload shift, or larger image layers, and each looks different underneath: a
    surge in manifest and blob reads, repeated errors or throttled responses, a steady
    stream of tag and listing calls, traffic moving between replicas, or more bytes
    per pull without more requests. To tell them apart, you need to know which operations
    are changing, how much artifact data is moving, where requests are being served,
    and whether the pattern matches the workload you intended to run. Push and pull
    counts summarize outcomes. Transactions and Data Transfer describe behavior, and
    describing behavior takes far more data. Why scale is the hard part These signals
    are high throughput by nature, because every counted request becomes its own data
    point: a single sampled registry''s activity can exceed 100,000 transactions and
    hundreds of gigabytes of data transferred (egress) in one hour. All of those dat…'
