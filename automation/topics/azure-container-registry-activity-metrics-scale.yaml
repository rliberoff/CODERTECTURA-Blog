code_example_ideas:
- Create an Azure Monitor chart for the new ACR Transactions metric split by ApiName
  and Region.
- Query ACR DataTransfer in Grafana and compare pull traffic across regions.
- Use the ACR monitoring reference to build an alert for unexpected 429 responses
  or data egress spikes.
