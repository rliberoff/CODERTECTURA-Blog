- Run the Cosmos DB Emulator in Docker locally and point a .NET app to the emulator
  endpoint.
- Add the emulator to a GitHub Actions workflow for integration tests against the
  same SDK used in production.
- Seed test data, run CRUD and query tests, and verify persistence and concurrency
  behavior during CI.
