    # Linux-based emulator - vNext

    * Applies to: ✅ NoSQL

    The next generation of the Azure Cosmos DB emulator is entirely Linux-based and
    is available as a Docker container. It supports running on a wide variety of processors
    and operating systems.

    Important

    This version of the emulator only supports the API for NoSQL in [gateway mode](sdk-connection-modes#available-connectivity-modes),
    with a select subset of features. It doesn''t currently enforce authentication.
    For more information, see [authentication](#authentication) and [feature support](#feature-support).

    ## Prerequisites

    * [Docker](https://www.docker.com/)

    ## Installation

    Get the Docker container image using `docker pull`. The container image is published
    to the [Microsoft Artifact Registry](https://mcr.microsoft.com/) as `mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest`.

    ```

    docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest

    ```

    ## Running

    To run the container, use `docker run`. Afterwards, use `docker ps` to validate
    that the container is running.

    ```

    docker run --detach --publish 8081:8081 --publish 8080:8080 --publish 1234:1234
    mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest docker ps

    ```

    ```

    CONTAINER ID IMAGE COMMAND CREATED STATUS PORTS NAMES c1bb8cf53f8a mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    "/bin/bash -c /home/…" 5 seconds ago Up 5 seconds 0.0.0.0:1234->1234/tcp, :::1234->1234/tcp,
    0.0.0.0:8081->8081/tcp, :::8081->8081/tcp

    ```

    The emulator includes two components:

    * **Data Explorer** - Interactively explore the data in the emulator. By default,
    this component runs on port `1234`.

    * **Azure Cosmos DB emulator** - A local version of the Azure Cosmos DB database
    service. By default, this component runs on port `8081`.

    The emulator gateway endpoint uses port `8081` at the address <http://localhost:8081>.
    To navigate to the Data Explorer, use the address <http://localhost:1234> in your
    web browser. The gateway endpoint is typically available immediately, but Data
    Explorer might take a few seconds to start.

    ### Health probe

    The emulator exposes a health probe endpoint on port `8080`. Use this endpoint
    to determine when the emulator is fully initialized and ready to accept requests.

    The following endpoints are available:

    * <http://localhost:8080/alive> — Liveness probe.

