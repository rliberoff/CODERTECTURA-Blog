    ## Description

    The Linux vNext emulator ignores `QueryRequestOptions.MaxItemCount` for a

    partition-scoped ordered LINQ query.

    The application requests a maximum of 20 items and calls `ReadNextAsync()` once,

    but the emulator returns thousands of items in that single `FeedResponse`.

    The identical application code pointed at an Azure Cosmos DB development

    instance returns exactly 20 items and a continuation token.

