    # Add Confluent Cloud for Apache Kafka source to an eventstream

    ## In this article

    This article shows you how to add Confluent Cloud for Apache Kafka source to an
    eventstream.

    Confluent Cloud for Apache Kafka is a streaming platform offering powerful data
    streaming and processing functionalities using Apache Kafka. By integrating Confluent
    Cloud for Apache Kafka as a source within your eventstream, you can seamlessly
    process real-time data streams before routing them to multiple destinations within
    Fabric.

    ## Prerequisites

    Access to a workspace in the Fabric capacity license mode (or) the Trial license
    mode with Contributor or higher permissions.

    A Confluent Cloud for Apache Kafka cluster and an API Key.

    Your Confluent Cloud for Apache Kafka cluster should be publicly accessible and
    not be behind a firewall or secured in a virtual network. If it resides in a protected
    network, connect to it by using [Eventstream connector virtual network injection](streaming-connector-private-network-support-guide).

    If you plan to use **TLS/mTLS settings**, make sure the required certificates
    are available in an **Azure Key Vault**:

    ## Launch the Select a data source wizard

    If you haven''t added any source to your eventstream yet, select the **Connect
    data sources** tile. You can also select **Add source** > **Connect data sources**
    on the ribbon.

    [![Screenshot that shows the selection of the tile for using an external source.](includes/media/select-external-source/select-use-external-source-tile.png)](includes/media/select-external-source/select-use-external-source-tile.png#lightbox)

    ![Screenshot that shows the selection of the tile for using an external source.](includes/media/select-external-source/select-use-external-source-tile.png)

    If you''re adding the source to an already published eventstream, switch to **Edit**
    mode. On the ribbon, select **Add source** > **Connect data sources**.

    [![Screenshot that shows selections for adding external sources.](includes/media/select-external-source/add-source-ribbon.png)](includes/media/select-external-source/add-source-ribbon.png#lightbox)

    ![Screenshot that shows selections for adding external sources.](includes/media/select-external-source/add-source-ribbon.png)

    ## Configure and connect to Confluent Cloud for Apache Kafka

    On the **Select a data source** page, select **Confluent Cloud for Apache Kafka**.

    ![Screenshot that shows the selection of Confluent as the source type in the Get
    events wizard.](includes/connectors/media/confluent-kafka-source-connector/select-confluent.png)

