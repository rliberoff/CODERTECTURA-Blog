    # Azure Database for PostgreSQL flexible server version policy

    ## In this article

    This article describes the Azure Database for PostgreSQL versioning policy.

    ## Major version

    A major version is a change in the first number of the version. For example, PostgreSQL
    16 to PostgreSQL 17 is a major version upgrade. Major versions introduce new features
    and capabilities. They might include changes that require application code updates.
    Azure Database for PostgreSQL supports each major PostgreSQL version from the
    date Azure begins offering support until the version reaches end of life (end
    of support) as defined by the PostgreSQL community. For details, see [PostgreSQL
    community versioning policy](https://www.postgresql.org/support/versioning/).

    ### Support policy

    The following table provides the retirement details for PostgreSQL major versions.
    The dates follow the [PostgreSQL community versioning policy](https://www.postgresql.org/support/versioning/).

