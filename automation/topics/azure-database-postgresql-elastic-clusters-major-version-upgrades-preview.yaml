    ## Understand pricing

    You incur charges for:

    **Protected instance fee**: Azure Backup for PostgreSQL - Flexible servers charges
    a *protected instance fee* as per the size of the database. When you configure
    backup for a PostgreSQL Flexible server, a protected instance is created. Each
    instance is charged on the basis of its size (in GBs) on a per unit (250 GB) basis.

    **Backup Storage fee**: Azure Backup for PostgreSQL - Flexible servers store backups
    in Vault Tier. Restore points stored in the vault-standard tier are charged a
    separate fee called Backup Storage fee as per the total data stored (in GBs) and
    redundancy type enable on the Backup Vault.

