    # Major version upgrades in Azure Database for PostgreSQL flexible server

    ## In this article

    Your Azure Database for PostgreSQL flexible server supports PostgreSQL versions
    18, 17, 16, 15, 14, 13, 12, 11. The Postgres community releases a new major version
    that contains new features about once a year. Additionally, each major version
    receives periodic bug fixes in the form of minor releases. Minor version upgrades
    include changes that are backward compatible with existing applications. An Azure
    Database for PostgreSQL flexible server periodically updates the minor versions
    during a customer''s maintenance window.

    Major version upgrades are more complicated than minor version upgrades. They
    can include internal changes and new features that aren''t backward compatible
    with existing applications.

    Your Azure Database for PostgreSQL flexible server has a feature that performs
    an in-place major version upgrade of the server. This feature simplifies the upgrade
    process by minimizing the disruption to users and applications that access the
    server.

    In-place upgrades retain the server name and other settings of the current server
    after the upgrade of a major version. They don''t require data migration or changes
    to the application connection strings. In-place upgrades are faster and involve
    shorter downtime than data migration.

    Note

    Azure Database for PostgreSQL supports in-place major version upgrades only to
    currently supported PostgreSQL versions. The target version must be officially
    supported by Azure at the time of the upgrade. The Azure portal prevents selecting
    unsupported versions, but API or CLI calls that target a deprecated version fail.
    Always consult the [Azure PostgreSQL versioning policy](/en-us/azure/postgresql/flexible-server/concepts-version-policy)
    and [upgrade how-to guide](/en-us/azure/postgresql/flexible-server/how-to-perform-major-version-upgrade)
    before initiating a major version upgrade.

    ## Upgrade validation checks

    Azure Database for PostgreSQL flexible server provides Upgrade Validation Checks
    to help assess upgrade readiness before starting a major version upgrade.

    Upgrade Validation Checks run a series of compatibility and configuration validations
    against the server to identify conditions that could cause the upgrade to fail
    or behave unexpectedly. Common checks include unsupported extensions, logical
    replication slots, prepared transactions, event triggers, unsupported object dependencies,
    and pending restart-required configuration changes.

    The validation process is designed to evaluate upgrade readiness without initiating
    the actual upgrade operation. The same validation checks are also performed automatic…'
