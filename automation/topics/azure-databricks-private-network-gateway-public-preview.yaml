    # Manage private endpoint rules

    ## In this article

    Note

    Azure Databricks charges for networking costs when serverless workloads connect
    to customer resources, and when performance-intensive services egress data cross-region
    back to clients. See [Understand Databricks networking costs](cost-management).

    This article describes how to manage private endpoint rules for private connectivity
    from serverless compute using the Azure Databricks account console. You can also
    use the [Network connectivity configurations API](https://docs.databricks.com/api/account/networkconnectivity).

    To configure private connectivity for serverless compute, see [Configure private
    connectivity to Azure resources](serverless-private-link) and [Configure private
    connectivity to resources in your VNet](pl-to-internal-network).

    ## View the connection status of a private endpoint rule

    After you create a private endpoint rule, you can view its status on the **Network
    connectivity configurations** page under **Private endpoint rules**.

    `PENDING`

    `ESTABLISHED`

    `REJECTED`

    `DISCONNECTED`

    `EXPIRED`

    `REJECTED`

    `DISCONNECTED`

    `PENDING`

    Most changes to private endpoint rules propagate to serverless compute within
    10 minutes, but can take up to 24 hours to fully apply.

    Note

    Private endpoint rules are billed by Azure for each hour they exist, regardless
    of connection state. To stop incurring charges, delete the rule. See [Remove private
    endpoint rules](#delete).

    :::

    ## Remove private endpoint rules

    You must be an Azure Databricks account administrator to remove a private endpoint.

    As an account administrator, go to the account console.

    In the sidebar, click **Security**.

    Click **Network connectivity configurations**.

    Select your NCC.

    In **Private endpoint rules**, click the trash button ![Trash](../../../_static/images/icons/trash-icon.png)
    at the right of the rule you want to remove.

    ![Trash](../../../_static/images/icons/trash-icon.png)

    If the rule is in `ESTABLISHED`, `REJECTED`, or `DISCONNECTED` state, Databricks
    might retain the private endpoint on your cloud resource for 1 day before permanently
    deleting it.

    `ESTABLISHED`

    `REJECTED`

    `DISCONNECTED`

    ## Update a private endpoint rule

    ![Kebab menu icon.](../../../_static/images/product-icons/overflowicon.svg)

