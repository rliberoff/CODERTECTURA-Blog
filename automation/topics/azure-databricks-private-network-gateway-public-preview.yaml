    # September 2026

    Azure Databricks released these features and improvements in September 2026.

    Note

    Releases are staged. Your Azure Databricks account might not be updated until
    a week or more after the initial release date.

    ## Table update triggers on OpenSharing objects and system tables are now generally
    available

    **September 30, 2026**

    Lakeflow Jobs table update triggers can monitor OpenSharing objects and system
    tables. See [Add a trigger to OpenSharing and system tables](../../../jobs/trigger-table-update#trigger-on-ds-and-sys).

    ## Control spreadsheet writeback with a workspace admin setting

    **September 30, 2026**

    Excel and Google Sheets writeback now requires a workspace admin to enable the
    **Allow spreadsheet writeback** security setting. See [Write data back to Azure
    Databricks using the Azure Databricks Excel Add-in](../../../integrations/excel/write-back)
    and [Write data back to Azure Databricks from Google Sheets](../../../integrations/google-sheets/write-back).

    ## Query tags for SQL warehouses are now generally available

    **September 30, 2026**

    Query tags are now generally available. You can apply custom key-value tags to
    SQL workloads for grouping, filtering, and cost attribution on Databricks SQL
    warehouses and Lakehouse//RT compute. Tags appear in `system.query.history` and
    on the **Query History** page of the Azure Databricks UI. See [Query tags](../../../sql/user/queries/query-tags).

    ## Databricks JDBC Driver (Simba) 2.8.4 is available

    **September 29, 2026**

    [Simba JDBC Driver (Legacy)](../../../integrations/jdbc/) 2.8.4 adds Java 25 support
    and upgrades `libthrift`, `httpclient5`, `httpcore5`, and `lz4-java`. Download
    it from the [JDBC drivers archive](https://www.databricks.com/spark/jdbc-drivers-archive)
    under **All JDBC Driver Versions (Simba)**.

    ## OpenAI GPT-6.1 Sol is now available on Unity Gateway

    **September 29, 2026**

    OpenAI [GPT-6.1 Sol](../../../machine-learning/foundation-model-apis/supported-models#openai-gpt-6-1-sol)
    is now available on Unity Gateway. You can access this model using [Foundation
    Model APIs](../../../machine-learning/foundation-model-apis/).

    Customers are responsible for ensuring their compliance with [applicable terms](../../../machine-learning/model-serving/acceptable-use-models).

