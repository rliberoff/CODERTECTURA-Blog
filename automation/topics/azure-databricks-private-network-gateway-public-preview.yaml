    # October 2026

    Azure Databricks released these features and improvements in October 2026.

    Note

    Releases are staged. Your Azure Databricks account might not be updated until
    a week or more after the initial release date.

    ## Saving an unchanged job no longer adds rows to the jobs system tables

    **October 19, 2026**

    Saving a job without changing its settings no longer adds rows to `system.lakeflow.jobs`
    or `system.lakeflow.job_tasks`, and `change_time` stays at the last change. This
    applies to saves from the UI, the Jobs API, and Declarative Automation Bundles.
    See [Jobs table schema](../../../admin/system-tables/jobs#jobs).

    ## `READ METADATA` privilege support for compliance security profile standards

    **October 16, 2026**

    The [`READ METADATA` privilege](../../../data-governance/unity-catalog/access-control/privileges-reference#read-metadata)
    now supports all compliance security profile standards supported by Azure Databricks
    and is available by default for workspaces with the [compliance security profile](../../../security/privacy/security-profile)
    enabled.

    For a full list of supported compliance standards, see [Compliance security profile](../../../security/privacy/security-profile).

    ## ADBC driver for Power BI is now generally available

    **October 15, 2026**

    The Arrow Database Connectivity (ADBC) driver for the Azure Databricks connector
    for Power BI is now generally available. ADBC is the default driver for new connections
    in Power BI Desktop and the Power BI service. See [Configure ADBC or ODBC driver
    for Power BI](../../../partners/bi/power-bi/adbc).

    ## MySQL integrated CDC pipeline is now generally available

    **October 15, 2026**

    The integrated CDC pipeline for MySQL is now generally available. An integrated
    CDC pipeline ingests change data from MySQL into Azure Databricks using a single
    pipeline, combining extraction and application into one pipeline update. Unlike
    the standard gateway-based architecture, an integrated CDC pipeline requires no
    separate ingestion gateway. See [Create an integrated CDC pipeline for MySQL](../../../ingestion/lakeflow-connect/mysql-integrated-pipeline).

    ## Context-based ingress policies for inbound private connectivity are now generally
    available

    **October 15, 2026**

    Context-based ingress policies for inbound Private Link are now generally available.
    Control which registered private endpoints can reach your workspaces…'
