  excerpt: '* Configure a private network gateway. # Configure a private network gateway.
    This article describes how to set up and manage a private network gateway using
    the account REST API. Before you create a private network gateway, make sure you
    have the following:. This subnet must not be used by any other Azure resource,
    and must be in the same region as your NCC and workspaces. * The IP address of
    a DNS resolver that is reachable from the gateway subnet. The gateway and its
    subnet must be in the same region as the NCC. All private network gateway configuration
    uses the account REST API. Delegate this subnet to `Microsoft.Databricks/workspaces`
    before you create the gateway. The delegated subnet must be in the same Azure
    region as your NCC and target workspaces, and must have enough IP addresses for
    the gateway nodes. ### Create the private network gateway. Creating a gateway
    from the account console REST API requires an OAuth access token from a service
    principal with client credentials, created beforehand by an account admin in the
    account console. To create the gateway, send a POST request to the `private-network-gateways`
    endpoint under your NCC. * **`azure_cloud_connection.gateway_subnet.resource_id`**
    (required): The full Azure resource ID of the subnet you delegated in the previous
    step. * **`destinations`** (required when `traffic_mode` is `SPECIFIC_DESTINATIONS`):
    The DNS names to route through the gateway. To create a gateway in `SPECIFIC_DESTINATIONS`
    mode, run the following:. A gateway uses the resolver you specify in `private_dns_resolvers`
    to resolve hostnames for the destinations you configure. The resolver must be
    reachable from the gateway subnet. If your private resources are registered in
    an Azure private DNS zone, link that zone to the VNet that contains the gateway
    subnet so the hostnames resolve correctly. You can update, delete, and list gateways
    with the account REST API. You can update `gateway_name`, `destinations`, `private_dns_resolvers`,
    and `traffic_mode` in place with a PATCH request. To change the gateway subnet,
    delete the gateway and create a new one. Deleting a gateway cuts off connectivity
    to the private resources that depend on it. To list the private network gateways
    in an NCC, send a GET request to the gateway endpoint under your NCC:.'
