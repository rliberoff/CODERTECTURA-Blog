    # Secure your Azure Traffic Manager deployment

    Azure Traffic Manager is a DNS-based traffic load balancer that distributes traffic
    across global Azure regions, providing high availability and responsive performance
    for your applications. Because Traffic Manager controls how clients are routed
    to your service endpoints, securing your Traffic Manager configuration is essential
    to prevent misrouting, unauthorized changes, and monitoring gaps that could affect
    application availability.

    This article provides security recommendations for Azure Traffic Manager. For
    an overview of Azure''s network security services and how they work together,
    see [What is Azure network security?](../networking/security/network-security)

    The security recommendations in this article implement Zero Trust principles:
    "Verify explicitly", "Use least privilege access", and "Assume breach". For comprehensive
    Zero Trust guidance, see the [Zero Trust Guidance Center](/en-us/security/zero-trust/).

    ## Network security

    Network security for Traffic Manager focuses on ensuring that health probes can
    reach your endpoints and that your DNS-based routing configuration prevents unintended
    traffic patterns. Because Traffic Manager operates at the DNS layer rather than
    as a proxy, network security focuses on probe access and endpoint configuration.

    * **Allow Traffic Manager health probe traffic through firewalls**: For Azure-hosted
    endpoints, configure network security groups (NSGs) or Azure Firewall rules to
    permit inbound traffic from Traffic Manager health probes by using the `AzureTrafficManager`
    service tag. For non-Azure endpoints, add the published Traffic Manager probe
    IP ranges to the allow list in the endpoint''s firewall. If probes are blocked,
    Traffic Manager marks endpoints as unhealthy and routes traffic away from otherwise
    healthy services, causing unexpected outages. For more information, see [Traffic
    Manager endpoint monitoring](traffic-manager-monitoring#firewall-setup-for-health-checks).

    * **Configure endpoint health monitoring over HTTPS for web endpoints**: Select
    HTTPS as the monitoring protocol for web endpoints in your Traffic Manager profile
    instead of HTTP. Use HTTPS probes to verify endpoints accept HTTPS connections.
