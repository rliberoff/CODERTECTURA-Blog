    # Azure DNS introduces Traffic Manager linked records (Public Preview)

    [![samimodak''s avatar](https://techcommunity.microsoft.com/t5/s/gxcuf89792/m_assets/avatars/default/avatar-10.svg?image-dimensions=50x50)](/users/samimodak/3612001)

