    # What is Azure Traffic Manager?

    Azure Traffic Manager is a DNS-based traffic load balancer that distributes traffic
    to your public-facing applications across global Azure regions. Traffic Manager
    provides your public endpoints with high availability and quick responsiveness.

    Traffic Manager uses DNS to direct client requests to the appropriate service
    endpoint based on a traffic-routing method. Traffic Manager also provides health
    monitoring for every endpoint. The endpoint can be any Internet-facing service
    hosted inside or outside of Azure. Traffic Manager provides a range of [traffic-routing
    methods](traffic-manager-routing-methods) and [endpoint monitoring options](traffic-manager-monitoring)
    to suit different application needs and automatic failover models. Traffic Manager
    is resilient to failure, including the failure of an entire Azure region.

    Note

    Azure provides a suite of fully managed load-balancing solutions for your scenarios.

    * If you want to load balance between your servers in a region at the application
    layer, review [Application Gateway](../application-gateway/overview).

    * If you need to optimize global routing of your web traffic and optimize top-tier
    end-user performance and reliability through quick global failover, see [Front
    Door](../frontdoor/front-door-overview).

    * To do network layer load balancing, review [Load Balancer](../load-balancer/load-balancer-overview).

    Your end-to-end scenarios might benefit from combining these solutions as needed.
    For an Azure load-balancing options comparison, see [Overview of load-balancing
    options in Azure](/en-us/azure/architecture/guide/technology-choices/load-balancing-overview).

    For more information about Traffic Manager, see:

    * [How Traffic Manager works](traffic-manager-how-it-works)

    * [Traffic Manager FAQs](traffic-manager-faqs)

    * [Traffic Manager profiles](traffic-manager-manage-profiles)

    * [Traffic Manager endpoints](traffic-manager-endpoint-types)

    ## Key features

    ### Increase application availability

    Traffic Manager monitors your endpoints and provides automatic failover when an
    endpoint goes down, delivering high availability for your critical applications.

