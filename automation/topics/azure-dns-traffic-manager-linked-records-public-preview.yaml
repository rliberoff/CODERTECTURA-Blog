    # Traffic Manager Linked Records overview

    ## In this article

    Traffic Manager Linked Records is an Azure DNS feature that creates a direct,
    managed link between an Azure DNS record set and an Azure Traffic Manager profile.
    When a DNS query is resolved, Azure DNS queries the linked Traffic Manager profile
    and returns the appropriate IP addresses directly to the client—without an intermediate
    CNAME redirect to `trafficmanager.net`.

    `trafficmanager.net`

    Important

    Traffic Manager Linked Records is currently in PREVIEW. See the [Supplemental
    Terms of Use for Microsoft Azure Previews](https://azure.microsoft.com/support/legal/preview-supplemental-terms/)
    for legal terms that apply to Azure features that are in beta, preview, or otherwise
    not yet released into general availability.

    ## How it works

    With the existing [alias record](dns-alias) approach, an A, AAAA, or CNAME record
    set can reference a Traffic Manager profile via the `targetResource` property.
    In that model, CNAME alias records require an extra DNS lookup—the response includes
    the `trafficmanager.net` FQDN, and the client must resolve that name to reach
    an endpoint.

    `targetResource`

    `trafficmanager.net`

    Traffic Manager Linked Records use a new record set property called `trafficManagementProfile`
    to declare the link. When this property is set, Azure DNS resolves the Traffic
    Manager profile internally and returns the endpoint IP addresses (for A and AAAA
    records) or FQDNs (for CNAME records) directly in the DNS response. This process
    is known as **DNS flattening**, because Azure DNS resolves the intermediate Traffic
    Manager name on behalf of the client and returns the final answer directly. Integrated
    mode is always active for Traffic Manager Linked Records.

    `trafficManagementProfile`

    ## Benefits

    Traffic Manager Linked Records provide several advantages over alias records and
    traditional CNAME configurations:

    **No `trafficmanager.net` exposure** - Because Azure DNS resolves the Traffic
    Manager profile internally, the `trafficmanager.net` domain is never returned
    in the DNS response. Clients don''t need firewall rules for `trafficmanager.net`—a
    shared domain that hosts profiles for all Azure customers. This isolation reduces
    your attack surface and avoids unintentionally allowing access to other customers''
    Traffic Manager profiles.

    `trafficmanager.net`

    `trafficmanager.net`

    `trafficmanager.net`

    **DNSSEC compatibility** - Traffic Manager Linked Records maintain the DNSSEC
    chain of trust. Because DNS resolution stays within Azure DNS infrastructure,
