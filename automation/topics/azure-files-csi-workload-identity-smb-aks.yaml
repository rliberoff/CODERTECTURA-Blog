    # Use Container Storage Interface (CSI) drivers on Azure Kubernetes Service (AKS)

    The Container Storage Interface (CSI) is a standard for exposing arbitrary block
    and file storage systems to containerized workloads on Kubernetes. When using
    CSI, Azure Kubernetes Service (AKS) can write, deploy, and iterate plug-ins to
    expose new or improve existing storage systems in Kubernetes without having to
    touch the core Kubernetes code and wait for its release cycles.

    The CSI storage driver support on AKS allows you to natively use **Azure Disks**,
    **Azure Files**, or **Azure Blob storage** as persistent storage for your applications
    running on AKS.

    Tip

    If you want a fully managed solution for block-level access to data, consider
    using [Azure Container Storage](/en-us/azure/storage/container-storage/container-storage-introduction)
    instead of CSI drivers. Azure Container Storage integrates with Kubernetes so
    you can dynamically provision persistent volumes for stateful applications on
    Kubernetes clusters.

    Important

    Beginning with Kubernetes version 1.26, in-tree persistent volume types `kubernetes.io/azure-disk`
    and `kubernetes.io/azure-file` are deprecated and are no longer supported. *In-tree
    drivers* refer to the storage drivers that are part of the core Kubernetes code
    opposed to the CSI drivers, which are plug-ins.

    Removing these drivers following their deprecation isn''t planned, however you
    should migrate to the corresponding CSI drivers `disk.csi.azure.com` and `file.csi.azure.com`.
    To review the migration options for your storage classes and upgrade your cluster
    to use Azure Disks and Azure Files CSI drivers, see [Migrate from in-tree to CSI
    drivers](csi-migrate-in-tree-volumes).

    If you created in-tree driver storage classes, those storage classes continue
    to work since CSI migration is turned on after upgrading your cluster to 1.21.x.
    If you want to use CSI features, you need to perform the migration.

    ## About Azure Disks CSI driver

