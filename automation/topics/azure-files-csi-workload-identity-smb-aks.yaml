    # Create and manage persistent volumes (PVs) with Azure Files in Azure Kubernetes
    Service (AKS)

    Azure Files enables multiple pods to share persistent storage in AKS using SMB
    or NFS protocols, surviving pod restarts, node failures, and cluster scaling events.
    This article shows you how to dynamically and statically create an Azure file
    share for use by multiple pods in an Azure Kubernetes Service (AKS) cluster.

    Note

    The Azure Files CSI driver only permits the mounting of SMB file shares using
    key-based (NTLM v2) authentication, and therefore doesn''t support the maximum
    security profile of Azure File share settings. Mounting NFS file shares doesn''t
    require key-based authentication.

    Note

    We recommend FIO when running benchmarking tests. For more information, see [benchmarking
    tools and tests](/en-us/azure/storage/files/nfs-performance#benchmarking-tools-and-tests).

    ## Quick-start checklist

    1. **Verify prerequisites**: Ensure Azure CLI 2.0.59+, Azure Files CSI driver
    enabled, and storage account available

    2. **Choose or create a storage class**: Use built-in classes (`azurefile-csi`,
    `azurefile-csi-premium`) or create a custom one

    3. **Create a PersistentVolumeClaim (PVC)**: Define storage size and access mode
    (typically ReadWriteMany)

    4. **Create a pod**: Reference the PVC in your pod''s volume configuration

    5. **Verify the mount**: Confirm the volume is mounted correctly using `kubectl
    describe pod`

    ## Prerequisites

    * Azure CLI version 2.0.59 or later installed and configured. Find the version
    using the `az --version` command. To install or upgrade, see [Install Azure CLI](/en-us/cli/azure/install-azure-cli).

    * The [Azure Files CSI driver](csi-storage-drivers) enabled on your AKS cluster.

    * An Azure [storage account](/en-us/azure/storage/common/storage-introduction).

    * When choosing between SSD (Premium) and HDD (Standard) file shares, it''s important
    you understand the provisioning model and requirements of the expected usage pattern
    you plan to run on Azure Files. Azure Files has three billing models: [provisioned
    v2](/en-us/azure/storage/files/understanding-billing#provisioned-v2-model) (recommended),
    [pay-as-you-go](/en-us/azure/storage/files/understanding-billing#pay-as-you-go-model),
    and the legacy [provisioned v1](/en-us/azure/storage/files/und…'
