    # Deploy and configure Microsoft Entra Workload ID on an Azure Kubernetes Service
    (AKS) cluster

    In this article, you learn how to deploy and configure an Azure Kubernetes Service
    (AKS) cluster with [Microsoft Entra Workload ID](workload-identity-overview).
    The steps in this article include:

    * Create a new or update an existing AKS cluster using the Azure CLI or Terraform
    with OpenID Connect (OIDC) issuer and Microsoft Entra Workload ID enabled.

    * Create a workload identity and Kubernetes service account.

    * Configure the managed identity for token federation.

    * Deploy the workload and verify authentication with the workload identity.

    * Optionally grant a pod in the cluster access to secrets in an Azure key vault.

    ## Prerequisites

    * If you don''t have an Azure account, create a [free account](https://azure.microsoft.com/pricing/purchase-options/azure-account?cid=msft_learn)
    before you begin.

    * This article requires version 2.47.0 or later of the Azure CLI. If using Azure
    Cloud Shell, the latest version is already installed. Run `az --version` to find
    the version. If you need to install or upgrade, see [Install Azure CLI](/en-us/cli/azure/install-azure-cli).

    * Make sure that the identity that you''re using to create your cluster has the
    appropriate minimum permissions. For more information, see [Access and identity
    options for Azure Kubernetes Service (AKS)](concepts-identity).

    * Make sure that your identity has permission to create role assignments at the
    key vault scope, such as the [Role Based Access Control Administrator](/en-us/azure/role-based-access-control/built-in-roles/privileged#role-based-access-control-administrator)
    role. The Contributor and Key Vault Contributor roles can''t create role assignments.

    * If you have multiple Azure subscriptions, select the appropriate subscription
    ID in which the resources should be billed using the [`az account set`](/en-us/cli/azure/account#az-account-set)
    command.

    * Terraform installed locally. For installation instructions, see [Install Terraform](https://developer.hashicorp.com/terraform/install).

    * The `ARM_SUBSCRIPTION_ID` environment variable set to the subscription ID where
    you want to create the resources. AzureRM 4.x requires the subscription ID for
    plan and apply operations.

