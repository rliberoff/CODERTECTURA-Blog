    # Azure Linux deployment options overview

    Azure Linux is available across multiple Azure experiences, each optimized for
    a specific scenario while sharing the same trusted Azure Linux foundation. Whether
    you''re deploying virtual machines (VMs), running Kubernetes workloads, building
    containerized applications, or setting up a local developer environment, Azure
    Linux provides a consistent platform with Microsoft-managed engineering, security
    response, and Azure-native integration.

    This article provides an overview of the different Azure Linux deployment options,
    explains the scenarios each option is optimized for, and helps you determine which
    deployment approach is best suited for your workloads.

    Note

    Azure Linux 4.0 is now in **preview** and is strictly limited to evaluation and
    testing purposes. It''s not suitable for production use.

    ## Deployment options

    The following table summarizes the primary Azure Linux deployment options, the
    scenarios they are optimized for, and the key features and benefits each option
    provides:

    | Use case | Deployment option | Features and benefits |

    | --- | --- | --- |

    | **Run Kubernetes workloads on a secure, Azure-native container host** | [Azure
    Linux container host for Azure Kubernetes Service (AKS)](azure-linux-aks-overview)
    | A container host optimized for AKS that delivers fast boot times, predictable
    updates, and strong security defaults with tight AKS lifecycle integration. Microsoft
    owns the full stack from kernel to CVE response, simplifying operations and reducing
    customer overhead. |

    | **Run containers on an immutable, hardened operating system (OS) with a minimal
    attack surface** | [Azure Container Linux (ACL)](azure-container-linux-overview)
    | An immutable, container-optimized OS for AKS derived from Flatcar Container
    Linux with Azure Linux packages and servicing. The OS uses kernel-enforced immutability
    (dm-verity), SELinux, Trusted Launch with Secure Boot, and a minimal package set
    to reduce the attack surface and block tampering. Automated weekly image-based
    updates and supply-chain signing keep nodes current and verifiable. |

    | **Run general-purpose VM workloads with Microsoft-supported Linux** | [Azure
