  excerpt: 'Sometimes we may see some temporary capacity restrictions on some Azure
    Regions, while deploying Azure Managed Redis (AMR), and when that happen, the
    recommendation is usually retrying using a different Azure Region, a different
    AMR SKU, or retrying during off-peak hours or weekends. Retrying the cache deployment
    on a different region without capacity restrictions allow us to create the cache
    immediately. But our business needs, requirements or company policies may not
    allow us to use a different region, and in that case we may need to keep retrying
    the AMR cache creation at different times of the day or during next days, or even
    trying different AMR SKUs. This PowerShell script was build to help on those scenarios.
    If this script was useful for you, please share your comments at the end of this
    page. Thank you. Table of Contents Overview Requirements How to run Script parameters
    Samples Authentication Logging Support Disclaimer The script Overview This script
    will try to create one Azure Managed Redis recurrently at different times of the
    day, based on just one SKU or on the list of SKUs provided. It will use different
    and random time intervals between each attempt, based on parameters provided.
    The script will remain in loop, trying to create an AMR cache with the details
    provided and from the SKU list, waiting a random time between each attempt. Deleting
    the failed resource is required before any other attempt to create another cache
    with same name. For that reason, if the deployment fails due to capacity restrictions,
    the script will delete the failed deployment before try to redeploy the same cache
    name again. The script will stop only after successful cache creation or due to
    any other exception not capacity related. It supports configuration for: Create
    caches with no Geo-Replication, new or existent Geo-Replication group With or
    without High Availability (HA) Eviction Policy definition Any supported clustering
    Policy Max retries and and minimum and maximum time between retries (script will
    use a random time between both) Requirements This script was written with the
    minimum requirements, using only PowerShell v7.6.5 or above and ARM template.
    It requires Az.Accounts and Az.Resources PowerShell modules that are usually already
    installed on most common PowerShell environments. How to run This PowerShell script
    can run on any environment that supports PowerShell, and includes three different
    modes to run: Using by default values: on this case the default values can be
    defined inside of script code. On this case just call script name: ./AMR_AutomatedCreation.ps1
    Defining values on command line : on this case some (or all) script parameters
    can be provided on the command line, that will override the default ones on script
    code: ./AMR_AutomatedCreation.ps1 -CacheName "MyAMRCache" -HighAvailability "Enabled"
    Providing values interactively: if script parameters are not provided by default
    (inside script code) or on command line, it will be asked…'
