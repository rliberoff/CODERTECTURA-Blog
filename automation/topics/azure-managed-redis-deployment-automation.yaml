    # Scale an Azure Managed Redis instance

    * Applies to: ✅ Azure Managed Redis

    Azure Managed Redis offers different SKUs and tiers, so you can choose the cache
    size and performance that fit your needs. You can scale to a larger memory size
    or switch to a tier with more compute performance. You can also scale down to
    a smaller or more appropriate tier. This article shows you how to scale your cache
    by using the Azure portal and tools such as Azure PowerShell and Azure CLI.

    Note

    Because each tier of Azure Managed Redis has almost the same features, use scaling
    mainly to change memory and performance characteristics. Scaling geo-replicated
    Azure Managed Redis caches is in preview.

    ## Types of scaling

    Azure Managed Redis supports scaling in two dimensions:

    * **Memory** Increasing memory increases the size of the Redis instance, so you
    can store more data. When you reduce the memory, make sure your current memory
    usage is less than the new memory size you want to use.

    * **vCPUs** Azure Managed Redis offers three tiers (*Memory Optimized*, *Balanced*,
    and *Compute Optimized*) that have an increasing number of vCPUs for each level
    of memory. Scaling to a tier with more vCPUs increases the performance of your
    instance without requiring you to increase memory. Unlike the Basic, Standard,
    and Premium tiers of Azure Cache for Redis that only use a single vCPU, Azure
    Managed Redis uses the Redis Enterprise stack. The Redis Enterprise stack can
    use multiple vCPUs, which means that the number of vCPUs used by your Redis instance
    directly correlates with throughput and latency performance.

    ## Performance tiers

    Four tiers of Azure Managed Redis are available, each with different performance
    characteristics and price levels.

    Important

    All in-memory tiers that use over 350 GB of storage are in preview, including
    Memory Optimized M500 and higher; Balanced B500 and higher; and Compute Optimized
    X500 and higher. All these tiers and higher are in preview.

    Flash Optimized tiers A2000 and A4500 are in preview.

    ### Tiers and SKUs at a glance

    Here are three tiers that store data in memory:

    * **Memory Optimized** Ideal for memory-intensive use cases that require a high
    memory-to-vCPU ratio (8:1) but don''t need the highest throughput performance.
    It provides a lower price point for scenarios where less processing power or throughput
    is necessary, making it an excellent choice for…'
