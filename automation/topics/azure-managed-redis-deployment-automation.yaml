    # What is Azure Managed Redis?

    * Applies to: ✅ Azure Managed Redis

    Azure Managed Redis provides an in-memory data store based on the [Redis Enterprise](https://redis.io/about/redis-enterprise/)
    software. Redis Enterprise improves the performance and reliability of the community
    edition of Redis, while maintaining compatibility. Microsoft operates the service,
    hosts it on Azure, and any application within or outside of Azure can use it.
    For more information on how Azure Managed Redis is built, see [Azure Managed Redis
    Architecture](architecture).

    Azure Managed Redis can improve the performance and scalability of an application
    that heavily uses backend data stores. It''s able to process large volumes of
    application requests by keeping frequently accessed data in the server memory,
    which can be written to and read from quickly.

    Redis brings a critical low-latency and high-throughput data storage solution
    to modern applications. Additionally, Redis is increasingly used for noncaching
    applications, including data ingestion, deduplication, messaging, and leaderboards

    Azure Managed Redis can be deployed standalone, or deployed along with other Azure
    app or database services, such as Azure Container Apps, Azure App Service, Azure
    Functions, Azure SQL, or Azure Cosmos DB.

    ## Key scenarios

    Azure Managed Redis improves application performance by supporting common application
    architecture patterns. Some of the most common patterns include the following:

    | Pattern | Description |

    | --- | --- |

    | Data cache | Databases are often too large to load directly into a cache. Use
    the [cache-aside](/en-us/azure/architecture/patterns/cache-aside) pattern to load
    data into the cache only as needed. When the system makes changes to the data,
    it can also update the cache, which is then distributed to other clients. Additionally,
    the system can set an expiration on data, or use an eviction policy to trigger
    data updates into the cache. |

    | Content cache | Many web pages are generated from templates that use static
    content such as headers, footers, and banners. These static items shouldn''t change
    often. Using an in-memory cache provides quick access to static content compared
    to backend datastores. This pattern reduces processing time and server load, allowing
    web servers to be more responsive. It can reduce the number of servers needed
    to handle loads. Azure Managed Redi…'
