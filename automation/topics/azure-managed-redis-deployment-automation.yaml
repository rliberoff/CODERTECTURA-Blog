    # Quickstart: Use Azure Managed Redis in .NET Core

    * Applies to: ✅ Azure Managed Redis

    This .NET 8 console application demonstrates how to connect to **Azure Managed
    Redis** by using **Microsoft Entra ID** authentication. The core value proposition
    is **passwordless authentication** with automatic token refresh, providing a secure
    and modern approach to Redis connectivity.

    ## Skip to the code on GitHub

    Clone the [Microsoft.Azure.StackExchangeRedis](https://github.com/Azure/Microsoft.Azure.StackExchangeRedis/tree/main/sample)
    repo on GitHub.

    ## Prerequisites

    * [.NET 8.0 SDK](https://dotnet.microsoft.com/download/dotnet/8.0).

    * An **Azure Managed Redis** instance provisioned in your Azure subscription.

    * Your Azure user or service principal must be added as a Redis user on the cache.
    In the Azure portal, go to **Authentication** on the Resource menu, select **User
    or service principal**, and add your identity.

    * [Azure CLI](/en-us/cli/azure/install-azure-cli?view=azure-cli-latest) for local
    development authentication.

    ## Required NuGet Packages

    | Package | Purpose |

    | --- | --- |

    | `Microsoft.Azure.StackExchangeRedis` | Extension library that adds Microsoft
    Entra ID authentication to StackExchange.Redis |

    | `Azure.Identity` | Provides `DefaultAzureCredential` and other Azure identity
    implementations |

    | `StackExchange.Redis` | The underlying Redis client (pulled in as a dependency)
    |

    | `Microsoft.Extensions.Logging.Console` | Console logging for diagnostics |

    ## Authentication methods

    The extension supports multiple identity types, each with a corresponding `ConfigureForAzure*()`
    extension method:

    1. **`DefaultAzureCredential`** - The recommended approach. It chains multiple
    credential sources (environment variables, managed identity, Azure CLI authentication,
    Visual Studio credentials, and more) and uses the first one that works. It''s
    ideal for code that runs both locally and in Azure.

    2. **User-Assigned Managed Identity** - For Azure-hosted apps where you explicitly
    specify which managed identity to use by providing its client ID.

    3. **System-Assigned Managed Identity** - For Azure-hosted apps that use the identity
    automatically assigned to the resource.

    4. **Service Principal (Secret)** - Client ID, tenant ID, and secret for automated
    or CI scenarios.

