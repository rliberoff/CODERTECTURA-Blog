    # Use Microsoft Entra ID for cache authentication with Azure Managed Redis

    * Applies to: ✅ Azure Managed Redis

    Azure Managed Redis offers a password-free authentication mechanism by integrating
    with [Microsoft Entra ID](/en-us/azure/active-directory/fundamentals/active-directory-whatis).
    Azure Managed Redis caches use Microsoft Entra ID by default. When you create
    a new cache, managed identity is enabled.

    Although access key authentication is still available, it comes with a set of
    challenges around security and password management. For contrast, in this article,
    you learn how to use a Microsoft Entra token for cache authentication.

    In this article, you learn how to use your service principal or managed identity
    to connect to your Redis instance.

    ## Prerequisites and limitations

    * Microsoft Entra authentication is supported for SSL connections only.

    * Microsoft Entra groups aren''t supported.

    * Some Redis commands are blocked. For a full list of blocked commands, see [Redis
    commands not supported in Azure Managed Redis](best-practices-client-libraries#blocked-commands).

    Important

    After a connection is established by using a Microsoft Entra token, client applications
    must periodically refresh the Microsoft Entra token before expiry. Then the apps
    must send an `AUTH` command to the Redis server to avoid disrupting connections.
    For more information, see [Configure your Redis client to use Microsoft Entra](#configure-your-redis-client-to-use-microsoft-entra).

    ## Configure your Redis client to use Microsoft Entra

    If you used access keys in the past for authentication, update your client workflow
    to support authentication by using Microsoft Entra ID. In this section, you learn
    how to connect to Azure Managed Redis using a Microsoft Entra ID.

    ### Add users or system principal to your cache

    1. Connect to your cache in the Azure portal.

    2. On the Resource menu, select **Authentication**.

    3. On the **Microsoft Entra Authentication** tab, select **User or service principal**
    and then **+ Select member**.

    4. Type the name of the user who you want to run the program. Select the user
    to add in the list and **Select**. The user is added to the list of Redis users.

    ![Screenshot of the authentication tab in a Redis cache on the Azure portal.](media/entra-for-authentication/redis-add-user.png)

    Tip

    By default, users receive full access to all commands and keys. To…'
