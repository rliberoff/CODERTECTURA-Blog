    # CREATE CREDENTIAL (Transact-SQL)

    ## في هذه المقالة

    **Applies to:** ![](../../includes/media/yes-icon.svg?view=azuresqldb-mi-current)

    [SQL Server](../../sql-server/sql-docs-navigation-guide?view=azuresqldb-mi-current#applies-to)
    ![](../../includes/media/yes-icon.svg?view=azuresqldb-mi-current)

    [Azure SQL Managed Instance](../../sql-server/sql-docs-navigation-guide?view=azuresqldb-mi-current#applies-to)

    ![](../../includes/media/yes-icon.svg?view=azuresqldb-mi-current)

    ![](../../includes/media/yes-icon.svg?view=azuresqldb-mi-current)

    Creates a server-level credential. A credential is a record that contains the
    authentication information that is required to connect to a resource outside SQL
    Server. Most credentials include a Windows user and password. For example, saving
    a database backup to some location might require SQL Server to provide special
    credentials to access that location. For more information, see [Credentials (Database
    Engine)](../../relational-databases/security/authentication-access/credentials-database-engine?view=azuresqldb-mi-current).

    Note

    To make the credential at the database-level use [CREATE DATABASE SCOPED CREDENTIAL
    (Transact-SQL)](create-database-scoped-credential-transact-sql?view=azuresqldb-mi-current).

    Create a server-level credential with `CREATE CREDENTIAL` when you need to use
    the same credential for multiple databases on the server.

    `CREATE CREDENTIAL`

    `CREATE DATABASE SCOPED CREDENTIAL`

    ![](../../includes/media/topic-link-icon.svg?view=azuresqldb-mi-current)

    [Transact-SQL syntax conventions](../language-elements/transact-sql-syntax-conventions-transact-sql?view=azuresqldb-mi-current)

    ![](../../includes/media/topic-link-icon.svg?view=azuresqldb-mi-current)

    ## Syntax

    `CREATE CREDENTIAL credential_name

    WITH IDENTITY = ''identity_name''

    [ , SECRET = ''secret'' ]

    [ FOR CRYPTOGRAPHIC PROVIDER cryptographic_provider_name ]`

    ## Arguments

    #### *credential\_name*

    Specifies the name of the credential being created. *credential\_name* can''t
    start with the number (#) sign. System credentials start with ##.

    Important

    When using a shared access signature (SAS), this name must match the container
    path, start with https and must not contain a forward slash. See [example D](#d-creating-a-credential-using-a-sas-token).

    When used for backup/restore using external data platforms, such as Azure Blob
    Storage or S3-compatible platforms, the following table provides common paths:

    | External Data Source | Location path | Example |

    | --- | --- | --- |

    | Azure Blob Storage (V2) | `https://<mystorageaccountname>.blob.core.windows.net/<mystorageaccountcontainername>`
    | [Example D](#d-creating-a-credential-using-a-sas-token) |

