  excerpt: 'Chat is becoming a standard interaction model across customer support,
    collaboration, gaming, marketplaces, healthcare, financial services, and AI-powered
    applications. But building a production-ready chat system involves much more than
    opening a WebSocket connection. Teams also need to manage rooms and membership,
    deliver and order messages, retain conversation history, recover from connection
    interruptions, and enforce permissions. Today, we are excited to announce that
    Azure Web PubSub chat is available in public preview . Azure Web PubSub chat is
    a managed capability built on Azure Web PubSub. It provides chat-focused client
    and server APIs so developers can work directly with familiar concepts such as
    rooms, messages, members, users, and roles , while Azure manages the underlying
    real-time messaging infrastructure. Focus on the chat experience, not the messaging
    plumbing Azure Web PubSub already helps developers build large-scale, real-time
    applications. The new chat capability adds a higher-level abstraction for applications
    whose primary interaction model is conversation. Instead of defining custom events,
    message schemas, membership logic, persistence workflows, and reconnect behavior,
    developers can use built-in chat operations to: Create one-to-one or group rooms.
    Add and remove room members. Send ordered messages in real time. Retrieve persistent
    room message history. Apply built-in or custom roles and permissions. Reconnect
    clients and recover messages after temporary connection loss. These capabilities
    run on Azure Web PubSub infrastructure and inherit its automatic scaling, geo-replication,
    security, and compliance foundations. Chat-native APIs for clients and servers
    Azure Web PubSub chat provides two complementary ways to build. The JavaScript
    client SDK , available through the `@azure/web-pubsub-chat-client` npm package,
    connects applications to a chat hub. Clients can create rooms, exchange messages,
    load history, manage members, and subscribe to chat events. The Chat REST API
    supports trusted server-side and administrative workflows, including managing
    rooms, users, members, messages, roles, and permissions. This separation lets
    client applications deliver responsive real-time experiences while backend services
    retain control over identity, moderation, governance, and business rules. For
    example, after connecting a `ChatClient`, creating a room and sending a message
    takes only a few calls: const room = await client.createRoom("Project Falcon",
    ["bob", "carol"]); client.on("message", ({ message }) => { console.log(`${message.createdBy}:
    ${message.content.text}`); }); await client.sendToRoom(room.roomId, "Welcome to
    the project room!"); Applications can also read message history through an asynchronous
    iterator, making it straightforward to implement initial conversation loading
    or incremental history as a user scrolls. Keep chat data in your Azure Storage
    account Persistent chat data remains in an Azure Storage account selected…'
