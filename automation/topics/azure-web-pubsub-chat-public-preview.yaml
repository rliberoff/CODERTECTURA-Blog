    # Azure Web PubSub extension of isolated-process Azure Functions client library
    for .NET - version 1.7.0

    This extension defines the binding types and triggers in the .NET isolated worker
    process for Azure Functions, allowing you to write functions that respond to any
    event published to Web PubSub.

    [Source code](https://github.com/Azure/azure-sdk-for-net/tree/Microsoft.Azure.Functions.Worker.Extensions.WebPubSub_1.7.0/sdk/webpubsub/Microsoft.Azure.Functions.Worker.Extensions.WebPubSub/src)
    | Package | API reference documentation | [Product documentation](https://aka.ms/awps/doc)
    | [Samples](https://github.com/Azure/azure-sdk-for-net/tree/Microsoft.Azure.Functions.Worker.Extensions.WebPubSub_1.7.0/sdk/webpubsub/Microsoft.Azure.Functions.Worker.Extensions.WebPubSub/samples)

    ## Getting started

    ### Install the package

    Install the client library from [NuGet](https://www.nuget.org/):

    ```

    dotnet add package Microsoft.Azure.Functions.Worker.Extensions.WebPubSub

    ```

    ### Prerequisites

    You must have an [Azure subscription](https://azure.microsoft.com/free/dotnet/)
    and an Azure resource group with a Web PubSub resource. Follow this [step-by-step
    tutorial](/en-us/azure/azure-web-pubsub/howto-develop-create-instance) to create
    an Azure Web PubSub instance.

    ### Authenticate the client

    In order to let the extension work with Azure Web PubSub service, you will need
    to provide a valid `ConnectionString`.

    You can find the **Keys** for you Azure Web PubSub service in the [Azure Portal](https://portal.azure.com/).

    The `AzureWebJobsStorage` connection string is used to preserve the processing
    checkpoint information as required refer to [Storage considerations](/en-us/azure/azure-functions/storage-considerations#storage-account-requirements)

    For the local development use the `local.settings.json` file to store the connection
    string, can be set to `WebPubSubConnectionString` as default supported in the
    extension, or you can set customized names by mapping it with `Connection =` in
    function binding attributes:

    ```

    { "Values": { "AzureWebJobsStorage": "UseDevelopmentStorage=true", "": "Endpoint=https://.webpubsub.azure.com;AccessKey=;Version=1.0;"
    } }

    ```

    When deployed use the [application settings](/en-us/azure/a…'
