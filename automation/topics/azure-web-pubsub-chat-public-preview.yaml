    # Tutorial: Create a serverless notification app with Azure Functions and Azure
    Web PubSub service

    The Azure Web PubSub service helps you build real-time messaging web applications
    using WebSockets. Azure Functions is a serverless platform that lets you run your
    code without managing any infrastructure. In this tutorial, you learn how to use
    Azure Web PubSub service and Azure Functions to build a serverless application
    with real-time messaging under notification scenarios.

    In this tutorial, you learn how to:

    * Build a serverless notification app

    * Work with Web PubSub function input and output bindings

    * Run the sample functions locally

    * Deploy the function to Azure Function App

    Important

    Raw connection strings appear in this article for demonstration purposes only.

    A connection string includes the authorization information required for your application
    to access Azure Web PubSub service. The access key inside the connection string
    is similar to a root password for your service. In production environments, always
    protect your access keys. Use Azure Key Vault to manage and rotate your keys securely
    and [secure your connection with `WebPubSubServiceClient`](howto-create-serviceclient-with-net-and-azure-identity).

    Avoid distributing access keys to other users, hard-coding them, or saving them
    anywhere in plain text that is accessible to others. Rotate your keys if you believe
    they may have been compromised.

