    # Tutorial: Create a serverless chat app with Azure Web PubSub service and Azure
    Static Web Apps

    Azure Web PubSub helps you build real-time messaging web applications using WebSocket.
    Azure Static Web Apps helps you build and deploy full-stack web apps automatically
    to Azure from a code repository. In this tutorial, you learn how to use Web PubSub
    and Static Web Apps together to build a real-time chat room application.

    More specifically, you learn how to:

    * Build a serverless chat app

    * Work with Web PubSub function input and output bindings

    * Work with Static Web Apps

    Important

    Raw connection strings appear in this article for demonstration purposes only.

    A connection string includes the authorization information required for your application
    to access Azure Web PubSub service. The access key inside the connection string
    is similar to a root password for your service. In production environments, always
    protect your access keys. Use Azure Key Vault to manage and rotate your keys securely
    and [secure your connection with `WebPubSubServiceClient`](howto-create-serviceclient-with-net-and-azure-identity).

    Avoid distributing access keys to other users, hard-coding them, or saving them
    anywhere in plain text that is accessible to others. Rotate your keys if you believe
    they may have been compromised.

    ## Overview

    ![Diagram showing how Azure Web PubSub works with Azure Static Web Apps.](media/tutorial-serverless-static-web-app/tutorial-serverless-static-web-app.png)

    GitHub or Azure Repos provide source control for Static Web Apps. Azure monitors
    the repo branch you select, and every time there''s a code change to the source
    repo a new build of your web app is automatically run and deployed to Azure. Continuous
    delivery is provided by GitHub Actions and Azure Pipelines. Static Web Apps detects
    the new build and presents it to the endpoint user.

    The sample chat room application provided with this tutorial has the following
    workflow.

    1. When a user signs in to the app, the Azure Functions `login` API is triggered
    to generate a Web PubSub service client connection URL.

