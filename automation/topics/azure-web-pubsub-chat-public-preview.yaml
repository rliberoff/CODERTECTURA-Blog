    # What is Azure Web PubSub service?

    Azure Web PubSub is a fully managed service for building applications that deliver
    updates in real time. It manages long-lived client connections and message delivery
    at scale, so you don''t have to operate the underlying real-time infrastructure.

    Use Web PubSub to build chat apps, stream AI-generated tokens, update dashboards,
    deliver notifications, coordinate multiplayer games, track locations, and create
    other experiences where waiting for the next HTTP request isn''t fast enough.

    Instead of spending development time managing connections, scaling messaging servers,
    and implementing message fan-out, your team can focus on the experience your application
    provides.

    ## Choose the development experience that fits your application

    Web PubSub offers multiple ways to build real-time applications. Each option solves
    a different development need while providing managed, scalable real-time communication.

    | Capability | Choose it when you want to | Developer value |

    | --- | --- | --- |

    | **Web PubSub (base service)** | Design a custom real-time application by using
    connections, users, groups, and events. | Get flexible messaging primitives without
    operating WebSocket infrastructure. |

    | **[Socket.IO on Azure](socketio-overview)** | Use the Socket.IO programming
    model or move an existing Socket.IO application to Azure. | Keep familiar Socket.IO
    APIs while Azure manages connection scaling and coordination. |

    | **[MQTT support](overview-mqtt)** | Connect MQTT clients over WebSocket or exchange
    messages between MQTT and native Web PubSub clients. | Reuse MQTT libraries and
    add protocol interoperability without building a translation layer. |

    | **[Web PubSub chat](chat-overview)** | Build chat with rooms, members, ordered
    messages, and message history. | Start with chat-specific APIs and managed capabilities
    instead of assembling a chat backend yourself. |

    If you''re not sure which option fits your application, see [Choose an Azure Web
    PubSub capability](choose-web-pubsub-capability).

    ## What can you build with the base service?

    The base Web PubSub service is a good fit when your application needs low-latency
    communication and you want control over its event model, message format, and business
    logic.

