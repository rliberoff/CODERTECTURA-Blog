    # Copilot code review: Now in JetBrains IDEs and Visual Studio

    ![](https://github.blog/wp-content/themes/github-2021-child/assets/img/featured-v3-new-releases.svg)

    Copilot code review is now in most standard editors and IDEs! 🚀 With this update,
    you can use Copilot code review directly in Visual Studio and JetBrains IDEs (including
    IntelliJ IDEA, PyCharm, WebStorm, and more). This adds to existing support in
    Xcode and Visual Studio Code.

    You can now:

    * Request Copilot code review feedback on your code before you open a pull request,
    from within JetBrains IDEs and Visual Studio.

    * Self-review your changes and get actionable feedback exactly where you write
    your code.

    * Use Copilot code review to catch logic, security, and performance issues, all
    within your editor of choice.

    Now you can get actionable feedback before others see your code, saving you time
    in your pull request review process!

    ## [Getting started](#getting-started)

    To get started, make sure your Copilot plugin for Visual Studio or JetBrains is
    up-to-date, stage your changes, and click the Copilot code review button.

    In Visual Studio, this change updates the existing self-review option (detailed
    in this [earlier announcement](https://devblogs.microsoft.com/visualstudio/catch-issues-before-you-commit-to-git/))
    to Copilot code review.

    ## [Questions or feedback?](#questions-or-feedback)

    For questions about any of these updates, join the conversation in our [GitHub
    Community](https://github.com/orgs/community/discussions/categories/copilot-conversations)
    discussion. We’d love to hear your thoughts!

