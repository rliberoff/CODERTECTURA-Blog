    # Upcoming changes to GitHub Copilot policies and billing

    ![](https://github.blog/wp-content/themes/github-2021-child/assets/img/featured-v3-improvements.svg)

    To provide a strong, consistent Copilot experience, we’re making three separate,
    upcoming changes to Copilot policies and billing. Please review the upcoming updates
    to understand what may impact you.

    ## [Reopening Copilot Business and Enterprise signups with billing updates](#reopening-copilot-business-and-enterprise-signups-with-billing-updates)

    Starting September 1, 2026, GitHub will start reenabling sign-ups for new Copilot
    Business and Copilot Enterprise customers paying by credit card or PayPal. To
    improve availability and reliability of Copilot services, we’re strengthening
    account vetting and updating billing experiences for customers who pay by credit
    card or PayPal.

    ### [What’s changing](#whats-changing)

    * All new Copilot Business or Copilot Enterprise seat assignments will require
    payment for each seat before users gain Copilot access.

    * At the start of the next billing cycle, all Copilot Business and Copilot Enterprise
    seats assigned will incur an upfront charge. This includes existing customers
    starting October 1, 2026.

    * If you exceed your included usage, additional payment may be required for you
    and your users to continue using Copilot.

    * Included usage may be prorated across the month to align with the seat cost
    proration.

    ### [What’s not changing](#whats-not-changing)

    * Copilot Business and Copilot Enterprise prices are **not** changing.

    * Revoking a seat does not result in a prorated refund. The removal will be reflected
    in your next monthly billing cycle.

    * All seats added in the middle of a billing cycle will continue to be prorated
    from date of assignment to end of bill cycle.

    * Additional usage exceeding included allowances will remain available for purchase.

    * Spend controls, usage tracking, and the option to purchase additional AI credits
    will remain available.

    Existing Copilot Business and Copilot Enterprise customers can expect these billing
    updates to take effect starting October 1, 2026.

    Fully canceling Copilot and returning later may trigger updated account vetting
    and billing behaviors.

    For more information, read our [Copilot Quick Start documentation](https://docs.github.com/copilot/get-started/quickstart).

