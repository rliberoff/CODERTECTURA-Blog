  excerpt: 'Azure Virtual WAN provides a managed networking architecture that simplifies
    connectivity between virtual networks, branch locations, VPN connections, and
    ExpressRoute connections. At the centre of this architecture is the Virtual Hub
    , which provides managed connectivity and routing. When Azure Firewall and the
    associated security and routing policies are configured for the Virtual Hub through
    Azure Firewall Manager, it becomes a secured virtual hub . Azure Firewall in the
    secured virtual hub can then provide centralized security and traffic inspection
    for traffic moving through the Virtual WAN environment. The same firewall can
    also be configured for private and public networking traffic inspection by setting
    the private and public Routing Intent. Public IP Addresses with Azure Firewall
    While we use the azure vWAN secure Hub with Azure Firewall and public routing
    intent, it requires Public IP addresses for public connectivity. These Public
    IP addresses are important for both inbound and outbound traffic scenarios . For
    outbound traffic , Azure Firewall Public IP addresses can be used as source addresses
    when workloads communicate with destinations on the internet. Having known Public
    IP addresses can be important when external systems allow traffic based on specific
    source IP addresses. For inbound traffic , Azure Firewall can provide controlled
    access to internal workloads through features such as Destination Network Address
    Translation (DNAT). External traffic reaches a Public IP associated with the firewall
    and is translated and forwarded to the appropriate internal destination according
    to the configured firewall rules. The same IP then can also be configured with
    DNS to provide an FQDN based endpoint solution to the upstream applications. In
    many deployments, Public IP addresses can be managed as part of the Azure Firewall
    deployment. However, there are also scenarios where organizations want to create
    and manage their own Public IP resources and then associate those specific Public
    IP addresses with Azure Firewall. For example, an organization might need to:
    Maintain consistent Public IP addresses across the deployment. Control the creation
    and lifecycle of the Public IP resources separately from Azure Firewall. Use known
    Public IP addresses for outbound connectivity where external systems depend on
    source IP allowlists. Maintain specific Public IP addresses for inbound connectivity
    and DNAT scenarios. Meet existing networking, security, or compliance requirements
    that depend on known Public IP addresses. The deployment model therefore changes
    from simply defining how many Public IP addresses the firewall requires to defining
    which Public IP resources the firewall should use . Customer-Provided Public IP
    Addresses Azure Firewall in Virtual WAN secured hubs now supports the use of customer-provided
    public IP addresses. This capability enables organizations to bring their own
    public IP addresses when deploying Azure Firewall in a secured Vi…'
