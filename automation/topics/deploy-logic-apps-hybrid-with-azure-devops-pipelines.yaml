    # Plan a Container Apps deployment on Azure Arc-enabled Kubernetes

    Use this article before installing the Container Apps extension on a production
    cluster. Container Apps on Azure Arc uses capacity and platform services supplied
    by your Kubernetes cluster. Decisions about nodes, load balancing, DNS, outbound
    connectivity, storage, identity, logging, and upgrades affect application availability.

    Use the sections in this article to identify deployment requirements and validate
    prerequisites before installation.

    ## Planning scope

    Container Apps on Azure Arc spans Azure resources, an existing Kubernetes cluster,
    and deployed applications. Plan for the following areas:

    | Area | Planning inputs |

    | --- | --- |

    | Azure management resources | Connected cluster, cluster extension, custom location,
    connected environment, provider registration, Azure RBAC, resource organization,
    container apps, and jobs |

    | Kubernetes cluster | Supported distribution and version, nodes, capacity, Kubernetes
    and OS lifecycle, cluster security, backup, and disaster recovery |

    | Networking | `LoadBalancer` implementation, IP addresses, routing, firewalls,
    DNS, certificates, outbound connectivity, and application dependencies |

    | Workloads | Images, revisions, scaling and job configuration, data, health probes,
    secrets, and resource requirements |

    | Observability | Kubernetes diagnostics, optional Log Analytics integration,
    access, retention, alerting, and ingestion costs |

    ## Supported topology and version matrix

    Use the latest vendor-supported Kubernetes patch release that Azure Arc-enabled
    Kubernetes also supports. The Container Apps documentation doesn''t publish a
    separate Kubernetes version range for each distribution. Validate the exact distribution
    and Kubernetes version with Microsoft support before a production installation
    or upgrade.

    The following matrix records the currently published distribution support. Revalidate
    it against [Available extensions for Azure Arc-enabled Kubernetes clusters](/en-us/azure/azure-arc/kubernetes/extensions-release)
    and [Azure Container Apps on Azure Arc limitations](azure-arc-overview#limitations)
    before every installation.

