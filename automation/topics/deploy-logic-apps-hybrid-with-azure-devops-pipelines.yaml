    # Azure Container Apps on Azure Arc

    ## In this article

    Azure Container Apps on Azure Arc-enabled Kubernetes lets you run Container Apps
    workloads on supported Kubernetes infrastructure outside Azure datacenters, including
    AKS on Azure Local. You manage the applications as Azure resources while the application
    containers and the Container Apps data plane run on your Kubernetes cluster.

    Running Container Apps on Azure Arc can help you:

    Container Apps on Azure Arc isn''t a hosted compute service. Your organization
    provides, secures, scales, patches, and operates the underlying Kubernetes cluster
    and its compute, networking, and storage resources.

    To prepare a cluster and deploy your first application, complete [Set up an Azure
    Arc-enabled Kubernetes cluster to run Azure Container Apps](azure-arc-enable-cluster),
    and then complete [Create a container app on Azure Arc](azure-arc-create-container-app).

    As you configure your cluster, you create or use these resources:

    **Connected cluster:** The Azure Resource Manager representation of your Kubernetes
    cluster. Azure Arc agents running in the cluster maintain the connection to Azure.
    For more information, see [What is Azure Arc-enabled Kubernetes?](/en-us/azure/azure-arc/kubernetes/overview).

    **Container Apps cluster extension:** Software installed in the cluster that provides
    the Container Apps controllers, ingress, scaling, Dapr, logging, and other data-plane
    components. The extension is a child resource of the connected cluster.

    **Custom location:** An Azure location resource that associates the connected
    cluster, the Container Apps extension, and the Kubernetes namespace where Container
    Apps resources are created.

    **Container Apps connected environment:** The application boundary into which
    developers deploy container apps and jobs. The connected environment references
    the custom location and contains configuration shared by its applications.

    The dependency order is: connected cluster > cluster extension > custom location
    > connected environment > container app or job. If an earlier resource is unhealthy,
    resources later in the chain might fail to provision.

    ## Limitations

    The following limitations apply to Azure Container Apps on Azure Arc-enabled Kubernetes.

    | Limitation | Details |

    | --- | --- |

    | Supported Azure regions | Australia East, East Asia, East US, North Central
    US, Southeast Asia, Sweden Central, UK South, West Europe, West US |

    | Cluster networking requirement | Must support [LoadBalancer](https://kubernetes.io/docs/concepts/services-networking/service/#loadbalancer)
    service type |

    | Node OS requirement | **Linux** only. |

    | Feature: Managed identities | [Not availabl…'
