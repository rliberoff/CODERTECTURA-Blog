  excerpt: 'Overview Logic Apps Hybrid runs Standard workflows on your own infrastructure:
    an Arc-enabled Kubernetes cluster that appears in Azure as a connected environment.
    You still author and manage the workflows in Azure, but the runtime is yours.
    Until now, setting up CI/CD for this meant writing the ARM template and the pipeline
    YAML by hand, and working out a few Hybrid-specific details along the way. The
    Azure Logic Apps (Standard) extension for Visual Studio Code can now generate
    all of it for you: the infrastructure template, its parameter file, and both pipelines.
    A separate Azure DevOps extension supplies the pipeline tasks that do the Hybrid-specific
    work. This post covers the whole path: generating the assets, what is inside them,
    the service connections and variables you need to supply, and running both pipelines.
    Things to consider first Three things work differently in Hybrid than in a cloud-only
    Standard deployment. The generated assets handle all of them, but the pipelines
    are much easier to follow once you know what they are. Connections cannot use
    managed identity Infrastructure as code for Standard normally produces managed
    API connections that authenticate with ManagedServiceIdentity . That does not
    work in Hybrid, because the runtime executes inside a container on your own cluster
    where no Azure managed identity is available. Hybrid connections use ActiveDirectoryOAuth
    with a Microsoft Entra ID app registration instead. The Hybrid Build task rewrites
    this at build time, so you do not have to. Any *-Authentication parameter of type
    ManagedServiceIdentity becomes: { "type": "ActiveDirectoryOAuth", "tenant": "@appsetting(''WORKFLOWAPP_AAD_TENANTID'')",
    "clientId": "@appsetting(''WORKFLOWAPP_AAD_CLIENTID'')", "secret": "@appsetting(''WORKFLOWAPP_AAD_CLIENTSECRET'')",
    "audience": "https://management.core.windows.net/" } The @appsetting() references
    resolve at runtime against Container App environment variables that the infrastructure
    template sets. The same package can therefore go to any environment; only the
    app settings change. The runtime runs on your cluster A Hybrid logic app uses
    Azure Container Apps on Arc-enabled Kubernetes. It is deployed as a Microsoft.App/containerApps
    resource with kind: workflowapp , tied to your cluster through a custom location.
    Workflow content lives on an SMB file share mounted at /home/site/wwwroot . Deployment
    goes through a ZIP deploy endpoint There is no App Service publishing involved.
    The package is posted to the Hybrid logic app''s zipdeploy endpoint, authorized
    with a bearer token from the client credentials flow. That is why the release
    task needs its own Hybrid Logic App service connection holding the Entra ID tenant,
    client ID, and client secret. What you''ll build A CI pipeline that packages your
    workflows and publishes the application ZIP and infrastructure templates, and
    a CD pipeline that deploys the infrastructure and releases the package to your
    Hybrid logic app. The runtime runs on your Arc-ena…'
