    # Architecture strategies for setting spending guardrails

    **Applies to this Azure Well-Architected Framework Cost Optimization checklist
    recommendation:**

    | **CO:04** | Set spending guardrails. Guardrails should include release gates,
    governance policies, resource limits, and access controls. Prioritize platform
    automation over manual processes. |

    | --- | --- |

    Spending guardrails are controls that help manage costs within a defined budget,
    prevent unexpected or excessive spending, and promote cost-effective resource
    utilization. Without appropriate guardrails, workload costs can exceed budget
    expectations, resulting in unplanned expenses and increased financial risk.

    This guide provides recommendations for establishing effective spending guardrails.
    It provides key strategies for determining when to use release gates, governance
    policies, resource limits, and access controls to manage costs and promote responsible
    resource utilization.

    **Definitions**

    | Term | Definition |

    | --- | --- |

    | Budget threshold | A predefined spending amount that triggers alerts or blocks
    deployments when approached or exceeded. |

    | Commitment-based discounts | Reduced rates earned by committing to a specific
    amount of usage or spending over time, such as reservations, savings plans, or
    prepaid subscriptions. |

    | Commitment utilization | The percentage of a commitment-based discount (such
    as a reservation or savings plan) that''s consumed by eligible resource usage
    within a billing period. Low utilization means you''re paying for committed capacity
    you aren''t using. |

    | Ephemeral environment | A short-lived infrastructure environment created on
    demand for development, testing, or staging, then destroyed when no longer needed.
    |

    | Governance | A set of policies, processes, and controls that help ensure that
    the workload is managed effectively, securely, and in compliance with organizational
    and regulatory requirements. |

    | Governance policies | A set of rules that enforce compliance and enable auditing
    of workload resources. |

    | Infrastructure as code (IaC) | A descriptive model for defining and deploying
    infrastructure, including networks, virtual machines, load balancers, and connection
    topologies. |

