    # What is an Azure landing zone?

    The Ready phase of the Cloud Adoption Framework helps you design your Azure landing
    zone to meet your organization''s requirements. An Azure landing zone is a proven
    and flexible architecture for governing, securing, and scaling a multi-subscription
    Azure environment. An Azure landing zone consists of two components:

    * **Platform landing zone:** The centralized foundation that establishes governance,
    security, and shared resources for all your Azure workloads.

    * **Application (workload) landing zones:** The environments where workload teams
    deploy and operate workload resources within the guardrails of the platform landing
    zone. *A workload is a collection of Azure resources, code, AI models, data, and
    infrastructure that work together to achieve a defined business outcome*.

    You can implement each component of your Azure landing zone in one of two ways:

    * **Accelerators**: Microsoft-provided accelerators for both platform landing
    zone and application landing zone scenarios use infrastructure as code to deploy
    Azure environments based on recommended practices.

    * **Custom build**: You design and build the solution internally or with support
    from Microsoft or Microsoft partners.

    For most organizations, accelerators provide the fastest path to a deployment
    that aligns with Microsoft''s recommended practices.

    ## Azure landing zone architecture

    Every Azure landing zone starts with the platform landing zone. Before you build
    a platform landing zone, define organizational requirements across the Azure landing
    zone [design areas](design-areas). These decisions determine how you design your
    Azure landing zone.

    The Azure landing zone reference architecture represents a recommended target
    architecture. Use it as a starting point and adapt it to meet your organization''s
    requirements.

