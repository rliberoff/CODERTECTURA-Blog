    # GitHub Copilot weekly releases — August 3

    ![](https://github.blog/wp-content/themes/github-2021-child/assets/img/featured-v3-new-releases.svg)

    This week’s updates across GitHub Copilot in the desktop app, CLI, and VS Code
    help you resume and organize work, review changes, and ask questions without losing
    context.

    ### [GitHub Copilot app](#github-copilot-app)

    * `Auto` now shows which model handled each completed request, plus AI credit
    and cache details when they’re available.

    * Jump directly into shared sessions, or use `/side` to explore a parallel question
    without disrupting your main task.

    * Apply the updated Impeccable skill to mobile interfaces, diagnose its setup,
    and run more focused design reviews.

    * Sessions now start and switch more efficiently.

    [Try the Copilot app](https://github.com/features/ai/github-app?utm_source=changelog-to-GHCP-week-aug-5&utm_medium=changelog&utm_campaign=weekly-moments-pmm-ghcp-cli-aug-2026).

    ### [GitHub Copilot CLI](#github-copilot-cli)

    * Easily manage multiple concurrent sessions from the Sessions sidebar. Simply
    click **<** (left arrow) to open the Sessions sidebar and use shortcuts to open
    new sessions (n), close current ones (x), and move between sessions with ease.
    Click **>** right arrow to close the sidebar.

    * Create an isolated worktree and begin a separate conversation with the new experimental
    `/worktree` command. This gives you another workspace for exploring changes without
    disrupting your current work.

    * Use `/rewind` without Git to restore the conversation and files Copilot changed
    while preserving subsequent edits.

    * See live tool-call durations in the timeline to identify slow commands.

    [Install the Copilot CLI](https://github.com/features/copilot/cli?utm_source=changelog-to-cli-week-aug-5&utm_medium=changelog&utm_campaign=weekly-moments-pmm-ghcp-cli-aug-2026).

    ### [VS Code 1.132 Release updates](#vs-code-1-132-release-updates)

    * **The integrated browser now supports element-level feedback.** Select specific
    elements on a web page, attach a comment to each one, and send that precise visual
    feedback to the agent. You can select and annotate multiple elements before submitting
    your message.

    * **Dictate in multiple languages.** Dictation now uses a multilingual on-device
    model by default, keeping audio on your device. It can follow your configured
    language, use your system or browser locale, or automatically detect the language.
    A new onboarding experience also helps you select and test your microphone.

