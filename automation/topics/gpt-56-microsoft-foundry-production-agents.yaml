    ## First-of-its-kind telecom AI deployment

    Telecommunications organizations are increasingly looking to AI to help teams
    navigate highly specialized domains, but generic models often lack the industry-specific
    knowledge needed to understand telecom networks, standards, and operations. To
    address that gap, AT&T created their Open Telco (OTel) models, the next generation
    of telecom-focused AI designed to bring deeper telecommunications expertise into
    AI systems. Building OTel2.0 required more than training a large language model,
    it reflected a broader issue many organizations face: how to build domain-specific
    AI systems at scale while balancing cost, performance, and operational complexity.
    Cost management quickly became a key consideration. To continue advancing telecom-focused
    AI, AT&T needed a platform capable of supporting OTel2.0 development at an entirely
    new scale.

    Where teams previously had to own and manage deployments, infrastructure, and
    the associated operational overhead, [Foundry Managed Compute](https://learn.microsoft.com/en-us/azure/foundry/concepts/managed-compute-overview)
    provided a more streamlined way to access dedicated graphics processing unit (GPU)
    capacity. This transformation requires more than powerful models; it requires
    the ability to scale without compromising cost, flexibility, or performance.

    Using [Microsoft Foundry Managed Compute](https://devblogs.microsoft.com/foundry/announcing-foundry-managed-compute/),
    AT&T was able to experiment across multiple open models, optimize workloads across
    different GPU architectures, and process massive volumes of telecom data all within
    a unified platform. The result was an AI development environment capable of supporting
    trillions of tokens while giving teams the flexibility to iterate, optimize, and
    innovate faster.

    ## Model choice meets infrastructure flexibility

    Building OTel2.0 required flexibility across both models and infrastructure. Rather
    than standardizing on a single model, AT&T adopted a multi open-model strategy.
    Open models were central to AT&T’s approach because they provided the flexibility
    to work with approved telecom data, tailor the workflow for domain-specific model
    development, and support large-scale experimentation with greater control over
    cost and deployment strategy. Through [Microsoft Foundry](https://azure.microsoft.com/en-us/products/ai-foundry),
    the team deployed several models from the Hugging Face collection, including [Phi-4](https://azure.micr…'
