    # Review pull requests

    **Azure DevOps Services | Azure DevOps Server | Azure DevOps Server 2022**

    Tip

    You can use AI to help with Azure DevOps tasks. See [Enable AI assistance with
    Azure DevOps MCP Server](/en-us/azure/devops/mcp-server/mcp-server-overview) to
    get started.

    When you create a [pull request](pull-requests?view=azure-devops) (PR) and specify
    required and optional reviewers, Azure Repos notifies the reviewers that your
    PR is ready for review. All required reviewers must approve the changes in your
    PR before the changes can merge into the target branch. For PRs that change critical
    branches like `main`, your team might have [branch policies](branch-policies?view=azure-devops)
    that specify the reviewers or require a minimum number of reviewers. If branch
    policies add optional reviewers to your PR, you can keep them, require them, or
    remove them. If branch policies add required reviewers to your PR, you can''t
    make them optional or remove them. For information about assigning reviewers through
    branch policies and security best practices, see [Secure repositories and pull
    requests](secure-repositories-pull-requests?view=azure-devops) and [Automatically
    include code reviewers](branch-policies?view=azure-devops#include-code-reviewers).

    When you review a PR, give constructive feedback that''s precise and easy to understand.
    For more information, see [Pull request feedback](about-pull-requests?view=azure-devops#quality-feedback-for-pull-requests).

    You can only review Azure DevOps PRs in the web portal by using your browser.

