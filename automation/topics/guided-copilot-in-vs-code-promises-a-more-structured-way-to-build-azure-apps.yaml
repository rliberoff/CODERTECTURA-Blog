    |

    | **Services** | **Repos** enabled in your project. If the **Repos** hub doesn''t
    display, see [Turn an Azure DevOps service on or off](../../organizations/settings/set-services?view=azure-devops).
    |

    | **Access levels** | At least **Basic** access. For public projects, users with
    **Stakeholder** access have full access to **Azure Repos**. |

    | **Permissions** | Membership in the Azure DevOps project that contains the PR.
