    # What is Managed HSM external key management?

    Azure Key Vault Managed HSM external key management (EKM) connects Azure services''
    customer-managed-key (CMK) encryption at rest to an HSM you operate outside Microsoft
    infrastructure. You can protect supported Azure workloads with an externally held
    key while using Managed HSM for authentication, authorization, and the key interface
    those services already support.

    The Azure service continues to encrypt and decrypt your data. Your external HSM
    protects the service''s data encryption keys through an **EKM Proxy** that you
    or your HSM vendor operate. The key encryption key stays in your external HSM.

    EKM provides this integration for [Azure services that support CMKs with Managed
    HSM](/en-us/azure/security/fundamentals/encryption-customer-managed-keys-support).
    Review the supported-service guidance and your service''s CMK configuration documentation
    before planning your deployment.

    External key management is generally available. Azure Private Link integration
    for connecting Managed HSM to your EKM Proxy is in preview. For setup and preview
    terms, see [Configure the Azure Private Link model (preview)](external-key-management-networking#configure-the-azure-private-link-model-preview).

    ## How CMK encryption at rest works

    Most Azure customer-managed-key (CMK) encryption-at-rest integrations use envelope
    encryption. The Azure service encrypts and decrypts data with a data encryption
    key (DEK), while the customer-managed key acts as a key encryption key (KEK) to
    wrap and unwrap the DEK. External key management supports this pattern for [Azure
    services that support CMKs with Managed HSM](/en-us/azure/security/fundamentals/encryption-customer-managed-keys-support).
    It moves the KEK operation to your external HSM, not the service''s bulk-data
    encryption. Unwrap returns the DEK to the Azure service; it doesn''t release the
    external KEK.

    ## Why use external key management?

    External key management is the right choice when you have a hard requirement that
    your key material never physically resides on Microsoft infrastructure. Specific
    drivers include:

    * **Compliance with physical HSM possession requirements.** Use external key management
    when legal, regulatory, or contractual requiremen…'
