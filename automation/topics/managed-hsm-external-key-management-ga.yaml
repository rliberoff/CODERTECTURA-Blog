    # Key management in Azure

    ## In this article

    Note

    [Zero Trust](/en-us/security/zero-trust/zero-trust-overview) is a security strategy
    comprising three principles: "Verify explicitly", "Use least privilege access",
    and "Assume breach". Data protection, including key management, supports the "use
    least privilege access" principle. For more information, see [What is Zero Trust?](/en-us/security/zero-trust/zero-trust-overview)

    Azure supports platform-managed and customer-managed encryption keys.

    Azure generates, stores, and manages platform-managed keys (PMKs). You don''t
    need to interact with PMKs. For example, the keys used for [Azure Data Encryption
    at Rest](encryption-atrest) are PMKs by default.

    Customer-managed keys (CMKs) are keys that you create, delete, use, and manage.
    You can store CMKs in a customer-owned key vault or hardware security module (HSM).
    Bring your own key (BYOK) is a CMK scenario where you import keys from an external
    storage location into an Azure key management service. For more information, see
    [Azure Key Vault: Bring your own key specification](/en-us/azure/key-vault/keys/byok-specification).

    A key encryption key (KEK) is a primary key that controls access to one or more
    encryption keys that it encrypts.

    You can store CMKs on-premises or, more commonly, in a cloud key management service.

    ## Azure key management services

    Azure offers several options for storing and managing your keys in the cloud,
    including Azure Key Vault, Azure Key Vault Managed HSM, Azure Cloud HSM, Azure
    Payment HSM, and Azure Payment HSM v2 (preview). These options differ in their
    FIPS compliance level, management overhead, and intended applications.

    For a comprehensive guide to choosing the right key management solution, see [How
    to choose the right key management solution](key-management-choose).

    ### Azure Key Vault (standard tier)

    Azure Key Vault standard tier is a FIPS 140-2 Level 1 validated multitenant cloud
    key management service. You can use it to store asymmetric keys, secrets, and
    certificates. Keys stored in Azure Key Vault standard tier are software-protected.
    You can use them for encryption at rest and custom applications. Azure Key Vault
    standard tier provides a modern API and broad regional deployments and integrations
    with Azure services. For more information, see [About Azure Key Vault](/en-us/azure/key-vault/general/overview).

    ### Azure Key Vault (premium tier)

    Azure Key Vault premium tier is a FIPS 140-3 Level 3 validated, PCI-compliant,
    multitenant HSM offering. Use it to store asymmetric keys, secrets, and certificates,
    and to create HSM-protected symmetric keys (oct-HSM/AES) in public preview. It
    stores keys in…'
