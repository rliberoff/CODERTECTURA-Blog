    # Quickstart: Create your first external key using the Azure CLI

    ## In this article

    In this quickstart, you connect your external HSM to Managed HSM, create an external
    key reference, and test the key-protection path. You then use the Managed HSM
    key URI to configure customer-managed-key (CMK) encryption at rest in a compatible
    Azure service.

    For the encryption model and service compatibility, see [What is Managed HSM external
    key management?](external-key-management-overview)

    If you prefer to use the Azure portal, see [Quickstart: Create your first external
    key using the Azure portal](external-key-management-quickstart-portal).

    ## Prerequisites

    Before you begin, you need:

    `keyvault`

    `az extension add --name keyvault`

    `az extension update --name keyvault`

    `Managed HSM EKM Administrator`

    `Managed HSM Crypto User`

    ## Sign in to Azure

    `az login`

    Set your subscription if you have more than one:

    `az account set --subscription "<subscription-id>"`

    ## Show the Managed HSM client certificate

    Managed HSM presents an X.509 client certificate to your EKM Proxy on every inbound
    mutual TLS (mTLS) connection. Before you create the external key management connection,
    retrieve the certificate subject common name and the root CA certificate and allow-list
    it at your proxy. This lets the proxy validate that the connection comes from
    your Managed HSM, not an arbitrary caller.

    `az keyvault ekm-connection certificate show --hsm-name <Managed HSM Name>`

    The output looks similar to this:

    `{

    "caCertificates": [

    "MIIDj...<truncated>...MrY="

    ],

    "subjectCommonName": "contoso.managedhsmclient.azure.net"

    }`

    Configure your proxy to trust connections that present certificate with the `subjectCommonName`
    and rooted to one of the certificates in `caCertificates` list above. The exact
    steps depend on your proxy vendor.

    `subjectCommonName`

    `caCertificates`

    Note

    For rotation steps and certificate lifecycle details, see [Configure networking
    and mTLS for Managed HSM external key management](external-key-management-networking).

    ## Create the external key management connection

    The external key management connection binds your Managed HSM to a single EKM
    Proxy. It contains the proxy address, the server CA trust anchor, and an optional
    path prefix.

    This section creates a public internet connection. For Private Link, follow [Configure
    the Azure Private Link model (preview)](external-key-management-networking#configure-the-azure-private-link-model-preview)
    instead, then continue with [Verify the connection](#verify-the-connection).

    `az keyvault ekm-connection create \

    --hsm-name <Managed HSM Name> \

    --host <EKMProxy Host> \

    --server-ca-certificate <Root cert> \

