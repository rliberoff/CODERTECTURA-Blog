    # Configure networking and mTLS for Managed HSM external key management

    ## In this article

    This article covers the network and transport-layer security configuration required
    to connect Managed HSM to your EKM Proxy. It''s aimed at network and security
    engineers who are setting up or maintaining an external key management deployment.

    You''ll learn how to choose a connectivity model, what outbound traffic Managed
    HSM generates, and how to provision and rotate the mutual TLS (mTLS) certificates
    that authenticate both sides of the connection.

    This connection carries key-protection requests for your Azure service integration,
    not workload data. For the encryption model, see [How CMK encryption at rest works](external-key-management-overview#how-cmk-encryption-at-rest-works).

    For the end-to-end architecture and request flow, see [Managed HSM external key
    management architecture](external-key-management-architecture). For command-level
    setup steps, see [Quickstart: Create your first external key using the Azure CLI](external-key-management-quickstart-cli).

    ## Connectivity models

    Managed HSM initiates an outbound mTLS connection to your EKM Proxy. Two connectivity
    models are supported:

    Security doesn''t depend on network-layer restrictions in either model. The connection
    is protected by mutual TLS (mTLS): both sides present and verify X.509 certificates
    before any payload is exchanged. Private Link adds network isolation on top of
    mTLS; it doesn''t replace it. Managed HSM source IPs aren''t static and can''t
    be allow-listed, so certificate-based identity is the supported security mechanism
    in both models.

    ## Configure the public-internet model

    In this model, the EKM Proxy is reachable over the public internet on a publicly
    resolvable FQDN.

    `--host`

    `--server-ca-certificate`

    For the full `az keyvault ekm-connection create` command, see [Quickstart: Create
    your first external key using the Azure CLI](external-key-management-quickstart-cli).

    `az keyvault ekm-connection create`

    Note

    Even though the proxy is publicly reachable, the connection is still mutually
    authenticated. An attacker who reaches the proxy endpoint without a valid Managed
    HSM client certificate can''t complete the handshake.

