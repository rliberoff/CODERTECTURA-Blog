    # Securing AI agents: When AI tools move from reading to acting

    ## Listen to this post

    ![Copilot logo](https://www.microsoft.com/en-us/security/blog/wp-content/mu-plugins/ms-core/dist/svg/copilot-logo.svg)

    ## Share

    ## Content types

    ## Products and services

    ## Topics

    As enterprise deployments mature, some enterprise AI agents are shifting from
    reading content to taking action. In this post, Microsoft Incident Response walks
    through an attack pattern that targets the fastest growing part of the agentic
    AI supply chain: Model Context Protocol (MCP) tools. The post provides a practical
    playbook for detecting, containing, and preventing this class of attack using
    Microsoft security controls.

    ## From reading to acting

    This is the third post in the AI Application Security series. [AI Application
    Series 1: Security considerations when adopting AI tools](https://www.microsoft.com/en-us/security/security-insider/emerging-trends/ai-application-security-considerations-for-organizations)
    examined how AI adoption expands the enterprise attack surface. [AI Application
    Series 2: Detecting and analyzing prompt abuse in AI tools](https://www.microsoft.com/en-us/security/blog/2026/03/12/detecting-analyzing-prompt-abuse-in-ai-tools/)
    showed how indirect prompt injection can bias the output of a passive AI summarizer.
    In both cases, the AI only read content and produced text, it did not take action.
    This post addresses what happens when that boundary changes.

    AI agents can plan multi-step tasks, decide which tools to invoke, and execute
    actions on behalf of the user. Microsoft 365 Copilot can draft and send email,
    create documents, and update calendar entries. Copilot Studio and Azure AI Foundry
    allow organizations to build custom agents that connect to business systems through
    MCP. As AI is increasingly used in read-write workflows, the impact profile of
    vulnerabilities may shift. A prompt injection against a summarizer can bias an
    output. A prompt injection against an agent can trigger an action.

    According to the [International Data Corporation (IDC)](https://my.idc.com/getdoc.jsp?containerId=prUS53883425),
    the number of active AI agents in enterprises is projected to grow from 28.6 million
    in 2025 to more than 2.2 billion by 2030. That scale is why the [OWASP Top 10
    for Agentic Applications, released in December 2025](https://genai.owasp.org/2025/12/09/owasp-genai-security-project-releases-top-10-risks-and-mitigations-for-agentic-ai-security/),
    now sits alongside the LLM Top 10 as a reference framework for defenders. This
