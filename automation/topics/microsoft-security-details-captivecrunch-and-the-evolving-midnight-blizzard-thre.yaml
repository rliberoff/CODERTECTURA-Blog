    # Enhancing AI security through global AI red teaming

    ## Listen to this post

    ![Copilot logo](https://www.microsoft.com/en-us/security/blog/wp-content/mu-plugins/ms-core/dist/svg/copilot-logo.svg)

    ## Share

    ## Tags

    ## Content types

    ## Products and services

    ## Topics

    Most AI safety testing still happens inside the walls of individual organizations.
    That has resulted in a fundamental disconnect: many of the highest-risk failure
    modes in modern AI systems require deep domain expertise, multilingual context,
    or regional understanding that no single internal team can fully replicate on
    its own.

    As frontier models become more capable, the attack surface expands with them.
    AI red teaming is no longer just about prompt injection or content safety edge
    cases. It increasingly involves security operations, misuse scenarios, multilingual
    harms, alignment failures, and domain-specific abuse patterns that can vary significantly
    across geographies and languages.

    Microsoft’s AI Red Team has observed that meaningful testing of advanced AI systems-
    and models similarly requires broader participation from researchers and practitioners
    who operate outside traditional corporate security boundaries. To address that
    gap, today we are announcing the External Red Team Alliance (EXTRA), a formalized
    global extension of Microsoft’s AI Red Team designed to support and encourage
    external expertise to advance AI safety and security testing. We are proud to
    share we are funding the development of new AI safety assessments on six continents
    through unrestricted gifts.

    ## **Building a global alliance**

    EXTRA is a two-part initiative focused on expanding AI safety research and strengthening
    external collaboration.

    The first component supports a global academic network focused on advancing AI
    safety and security research. Microsoft’s AI Red Team has provided unrestricted
    gifts to 18 university labs spanning six continents. The goal is intentionally
    broad: support researchers who are already investigating difficult, unresolved
    questions in AI safety and help them continue pushing that work forward independently.

    Some of the supporting institutions include:

    “Academic research is critical to understanding the cyber security landscape and
    finding solutions that work for all of society – and partnerships like this with
    industry are essential to delivering on that promise. Through partnerships, civil
