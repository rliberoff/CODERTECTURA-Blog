    # Microsoft Entra ID security updates: Passkeys are the default authentication
    method in Entra ID

    ## Listen to this post

    ![Copilot logo](https://www.microsoft.com/en-us/security/blog/wp-content/mu-plugins/ms-core/dist/svg/copilot-logo.svg)

    ## Share

    ## Content types

    ## Products and services

    ## Topics

    As identity attacks grow more sophisticated in the AI era, organizations need
    stronger authentication methods that protect users from phishing, credential theft,
    and social engineering. To address these evolving threats, [Microsoft Entra ID](https://www.microsoft.com/en-us/security/business/identity-access/microsoft-entra-id)
    is updating its authentication experience by making passkeys the default phishing-resistant
    authentication method, helping customers reduce reliance on phishable methods
    such as SMS and voice.

    Beginning September 1, 2026, Microsoft will begin rolling out passkeys as the
    default authentication experience in Microsoft Entra ID. As the rollout reaches
    each organization, users enabled for SMS or voice authentication will automatically
    be enabled for passkeys, and the next time they perform multifactor authentication,
    they’ll be prompted to register a passkey.

    Following this transition, on February 1, 2027, Microsoft will retire Microsoft-provided
    telecom delivery for SMS and voice authentication and will no longer offer SMS
    and voice as a native [Microsoft Entra](https://www.microsoft.com/en-us/security/business/microsoft-entra)
    capability. Organizations that still require SMS or voice authentication methods
    will have the option to choose one of our telecom partners through the Microsoft
    Security Store. Customers will be responsible for any associated telecom-related
    costs charged by the telecom partners.

    We strongly recommend moving users to passkeys or another phishing-resistant authentication
    method as soon as possible.

    ## Why stronger authentication matters in the AI era

    Authentication methods that use SMS or voice rely on shared secrets or channels
    that attackers increasingly intercept, phish, or manipulate. [Passkeys](https://www.microsoft.com/en-us/security/business/security-101/what-is-passkey)
    use public-key cryptography rather than shared secrets, making them phishing-resistant
    by design. They also provide a faster, simpler sign-in experience for users.

    The case for moving beyond SMS and voice is no longer just that attackers intercept
    or socially engineer these methods. The threat environment has changed in speed,
