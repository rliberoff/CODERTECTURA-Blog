    # Unpacking the AsyncAPI npm supply chain compromise and import-time payload delivery

    ## Listen to this post

    ![Copilot logo](https://www.microsoft.com/en-us/security/blog/wp-content/mu-plugins/ms-core/dist/svg/copilot-logo.svg)

    ## Share

    ## Tags

    ## Threats intelligence

    ## Content types

    ## Products and services

    ## Topics

    On July 14, 2026, Microsoft Threat Intelligence identified a coordinated supply
    chain compromise of the @asyncapi npm organization, a widely used set of packages
    for the AsyncAPI specification and code generation. Five package versions across
    four package names were republished within roughly ninety minutes, each carrying
    the same maliciously injected loader: @asyncapi/specs (in both the 6.11.2-alpha.1
    prerelease and 6.11.2 stable release), @asyncapi/generator@3.3.1, @asyncapi/generator-components@0.7.1,
    and @asyncapi/generator-helpers@1.1.1.

    Because @asyncapi/specs is a transitive dependency of numerous AsyncAPI tooling
    packages, this attack affected developer workstations, CI/CD pipelines, container
    builds, or production services that resolved and imported the affected versions
    during the exposure window. Unlike the more common postinstall-hook supply-chain
    pattern, this campaign executes at module-load (import/require) time. When any
    consuming build or application imports a poisoned package, the injected block
    runs immediately. Because the trigger is an import rather than an install script,
    the common npm *install –ignore-scripts* mitigation does not neutralize it. The
    second stage decrypts and evaluates a Miasma modular runtime with active command
    and control (C2), persistence, and decentralized fallback channels. Although disabled
    in this instance, credential-harvesting, propagation, and additional high-risk
    modules could be enabled through persistence.

    Microsoft Defender Antivirus detects and blocks malicious artifacts as *Trojan:JS/MiasmStealer.SC*
    and *Trojan:Script/Supychain.A*. Microsoft Defender for Endpoint provides behavioral
    coverage for the suspicious detached Node.js process spawn, IPFS retrieval, and
    persistence activity. Organizations should immediately remove all five affected
    versions, purge npm and Yarn caches, hunt for *sync.js* under the *NodeJS* masquerade
    directories, block outbound connections to 85.137.53[.]71 on ports 8080, 8081,
    and 8091, and rotate all credentials accessible from any environment that imported
    the compromised packages. Detailed hunting queries, indicators of compromise,
    and mitigation guidance are provided in the succeeding sections.

