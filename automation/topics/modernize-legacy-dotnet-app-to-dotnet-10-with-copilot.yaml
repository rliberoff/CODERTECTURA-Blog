    # GitHub Copilot modernization FAQ

    GitHub Copilot modernization is an interactive GitHub Copilot agent that adds
    capabilities to your development environment. This article answers frequently
    asked questions. For more information, see [What is GitHub Copilot modernization](overview).

    The tool requires one of the following GitHub Copilot subscriptions:

    * Copilot Free (Starting with Visual Studio 2026 version 18.1)

    * Copilot Pro

    * Copilot Pro+

    * Copilot Business

    * Copilot Enterprise

    GitHub Copilot modernization is available in Visual Studio, Visual Studio Code,
    GitHub Copilot CLI, and on GitHub.com. For Visual Studio, it''s included in [Visual
    Studio 2026](https://visualstudio.microsoft.com/downloads/) (or Visual Studio
    2022 version 17.14.17 and newer).

    For more information about installation, [Install GitHub Copilot modernization](install).

    ## Modernization agent

    ### What can the agent do?

    GitHub Copilot modernization is focused on upgrading, migrating, and modernizing
    your .NET applications for Azure. It helps assess your app for Azure readiness,
    generates a migration plan, and guides you through the steps to deploy your app
    to Azure. The agent performs the following steps in a Copilot chat session:

    * Analyzes your projects and proposes a modernization plan.

    * Runs a series of tasks to modernize your projects according to the plan.

    * Operates in a working branch under a local Git repository.

    * Fixes issues automatically during the code transformation.

    * Reports progress and allows access to code changes and logs.

    * Learns from your interactions during the session to improve subsequent transformations.

