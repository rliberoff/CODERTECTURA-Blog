    # Install GitHub Copilot upgrade

    GitHub Copilot upgrade works across multiple development environments. Choose
    your preferred environment to install and set up GitHub Copilot upgrade.

    ## Prerequisites

    Before you install, make sure you have:

    * Windows operating system.

    * [Visual Studio 2026](https://visualstudio.microsoft.com/downloads/) (or Visual
    Studio 2022 version 17.14.17+).

    * [.NET desktop development workload](/en-us/visualstudio/install/modify-visual-studio?view=visualstudio&preserve-view=true#change-workloads-or-individual-components)
    with these optional components enabled: **GitHub Copilot**, **GitHub Copilot app
    modernization**.

    * GitHub Copilot subscription (paid or free).

    * [Sign in to Visual Studio with a GitHub account](/en-us/visualstudio/ide/work-with-github-accounts)
    that has [Copilot access](https://docs.github.com/copilot/get-started/plans#ready-to-choose-a-plan).

    * Code written in C# or Visual Basic.

    ## Install

    Visual Studio includes GitHub Copilot upgrade through the **GitHub Copilot app
    modernization** optional component, so you don''t need to install it separately.
    Enable the **GitHub Copilot** and **GitHub Copilot app modernization** optional
    components in the **.NET desktop development** workload through the Visual Studio
    Installer.

    ## Verify the installation

    1. Open a solution in Visual Studio.

    2. Right-click a project in **Solution Explorer** and select **Modernize**, or
    open **GitHub Copilot Chat** and type `@Modernize`.

    ## Prerequisites

    Before you install, make sure you have:

    * Visual Studio Code.

    * GitHub Copilot extension installed.

    * GitHub Copilot subscription (paid or free).

    ## Install

    Install as a Visual Studio Code extension:

    1. In Visual Studio Code, open the **Extensions** view (`Ctrl+Shift+X`).

    2. Search for **GitHub Copilot upgrade**.

    3. Select **Install**.

    The extension automatically acquires the .NET SDK if it''s missing, registers
    tools, and adds the agent to Copilot Chat as `Upgrade`.

    ## Verify the installation

    1. Open a project in Visual Studio Code.

    2. Open the **GitHub Copilot Chat** view.

    3. Send `@upgrade` in chat and confirm the agent responds.

    -or-

    Select the **Agent** picker and find the `Upgrade` entry.

