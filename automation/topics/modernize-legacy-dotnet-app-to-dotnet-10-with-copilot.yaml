    # Scenarios and skills reference

    GitHub Copilot upgrade for .NET helps you upgrade and modernize through *scenarios*
    and *skills*:

    * **Scenarios** are end-to-end managed workflows for major upgrade goals, such
    as upgrading from .NET Framework to .NET 10. Scenarios coordinate the full lifecycle:
    assessment, planning, and task-by-task execution.

    * **Skills** are focused capabilities for specific upgrade tasks, such as converting
    EF6 to EF Core or replacing WCF with CoreWCF. Skills activate automatically when
    the agent encounters relevant code during an upgrade.

    The agent supports both C# and Visual Basic projects.

    Tip

    You don''t need to memorize names. Describe what you want (*"upgrade to .NET 10"*,
    *"upgrade my EF6 code"*, *"replace Newtonsoft.Json"*) and the agent loads the
    right scenario and skills automatically. You can also ask: *"What can you help
    me with?"*

    ## Scenarios

    Scenarios are the agent''s top-level upgrade workflows. When you start a conversation,
    the agent identifies the best scenario for your goal and walks you through it
    step by step.

    | Scenario | What it does | Example prompt |

    | --- | --- | --- |

    | [**.NET version upgrade**](#net-version-upgrade) | Upgrades projects from any
    older .NET version to .NET 8 or later. | *"Upgrade my solution to .NET 10"* |

    | [**.NET Framework version upgrade**](#net-framework-version-upgrade) | Upgrades
    .NET Framework projects to .NET Framework 4.8.1, without moving to modern .NET.
    | *"Upgrade to .NET Framework 4.8.1"* |

    | [**SDK-style conversion**](#sdk-style-conversion) | Converts legacy project
    files to modern SDK-style format. | *"Convert my projects to SDK-style"* |

    | [**Visual Studio extension SDK-style conversion**](#visual-studio-extension-sdk-style-conversion)
    | Converts VSIX/VSSDK extension projects to SDK-style format. | *"Convert my VSIX
    project to SDK-style"* |

    | [**NuGet package upgrade**](#nuget-package-upgrade) | Upgrades specific NuGet
    packages and fixes the resulting breaking changes. | *"Upgrade Serilog to the
    latest version"* |

    | [**Newtonsoft.Json upgrade**](#newtonsoftjson-upgrade) | Replaces Newtonsoft.Json
    with System.Text.Json across a solution. | *"Upgrade from Newtonsoft.Json"* |

