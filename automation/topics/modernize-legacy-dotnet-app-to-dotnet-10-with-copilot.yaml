    # What is GitHub Copilot upgrade?

    GitHub Copilot upgrade is a GitHub Copilot agent that helps you upgrade projects
    to newer versions of .NET quickly and confidently. It guides you through assessment,
    solution recommendations, code fixes, and validation across Visual Studio, Visual
    Studio Code, GitHub Copilot CLI, and GitHub.com.

    Use this agent to:

    * Upgrade to a newer version of .NET.

    * Modernize your .NET app, especially when upgrading from .NET Framework.

    * Assess your application''s code, configuration, and dependencies.

    * Validate that your app builds and tests successfully.

    ## Scenarios

    The agent provides multiple end-to-end modernization workflows called *scenarios*.
    Each scenario is a managed workflow that guides you through a specific type of
    upgrade or migration:

    | Scenario | Description | Example prompt |

    | --- | --- | --- |

    | **.NET version upgrade** | Upgrades from older .NET versions to .NET 8, 9, 10,
    or later. | *"Upgrade my solution to .NET 10"* |

    | **SDK-style conversion** | Converts legacy project format to SDK-style. | *"Convert
    to SDK-style"* |

    | **Newtonsoft.Json upgrade** | Replaces Newtonsoft.Json with System.Text.Json.
    | *"Upgrade from Newtonsoft.Json"* |

    | **SqlClient upgrade** | Upgrades from System.Data.SqlClient to Microsoft.Data.SqlClient.
    | *"Update SqlClient"* |

    | **Azure Functions upgrade** | Upgrades Azure Functions from in-process to isolated
    worker model. | *"Upgrade my Azure Functions"* |

    | **Semantic Kernel to Agents** | Upgrades Semantic Kernel Agents to Microsoft
    Agent Framework. | *"Upgrade my SK agents"* |

    | **Aspire integration** | Adds [Aspire](https://aspire.dev) support for inner-loop
    and Azure deployment. | *"Add Aspire to my app"* |

    | **Aspire version upgrade** | Upgrades existing Aspire applications to newer
    versions. | *"Upgrade my Aspire version"* |

    | **WebForms-to-Blazor upgrade** | Upgrades ASP.NET Web Forms applications to
    Blazor. | *"Migrate my Web Forms app to Blazor"* |

    For a full reference of all scenarios and 30+ built-in upgrade skills, see [Scenarios
    and skills reference](scenarios-and-skills).

