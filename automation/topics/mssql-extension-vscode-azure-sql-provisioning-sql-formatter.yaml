    # Release notes for SQL Server Management Studio (SSMS)

    **Applies to**: ![](includes/media/yes-icon.svg) [SQL Server](/en-us/sql/sql-server/sql-docs-navigation-guide#applies-to)
    ![](includes/media/yes-icon.svg) [Azure SQL Database](/en-us/sql/sql-server/sql-docs-navigation-guide#applies-to)
    ![](includes/media/yes-icon.svg) [Azure SQL Managed Instance](/en-us/sql/sql-server/sql-docs-navigation-guide#applies-to)
    ![](includes/media/yes-icon.svg) [Azure Synapse Analytics](/en-us/sql/sql-server/sql-docs-navigation-guide#applies-to)

    This article provides details about updates, improvements, and bug fixes for the
    current version of SQL Server Management Studio 22.

    ## Current SQL Server Management Studio release

    **[Download SQL Server Management Studio (SSMS) 22](https://aka.ms/ssms/22/release/vs_SSMS.exe)**

    SQL Server Management Studio 22 is the latest general availability (GA) release
    of SSMS.

    For previous versions of SSMS, see:

    * [Release notes for SQL Server Management Studio (SSMS) 21](release-notes-21)

    * [Release notes for SQL Server Management Studio (SSMS) 20](release-notes-20)

    * [Release notes for SQL Server Management Studio (SSMS) 19 and earlier versions](release-notes-19)

    ### 22.9.0

    **[Download SQL Server Management Studio (SSMS) 22](https://aka.ms/ssms/22/release/vs_SSMS.exe)**

    * Release number: 22.9.0

    * Release date: August 11, 2026

    #### What''s new in 22.9.0

    | Feature | Details |

    | --- | --- |

    | Azure SQL Database | Updated the **Create Database** dialog for Azure SQL Databases
    with separate fields for compute and storage selection, removed options that don''t
    apply to Azure SQL Databases, and changed the default tier to Hyperscale Gen5
    2 vCore. |

    | Connection Dialog | Added the **hostname in certificate** field to the default
    connection properties view. |

    | Connection Dialog | Added support for subscription search and filtering when
    browsing Azure resources and workspaces, and when browsing Fabric resources. |

    | Connection Dialog | Added horizontal layout support. |

    | Connection Dialog | Changed the server name field to an editable drop-down menu
    for improved keyboard accessibility. |

    | Connection Dialog | Increased the maximum number of recent and favorite connections
    to 60. |

    | Connection Dialog | Added support for browsing Managed Instances for Azure.
    |

