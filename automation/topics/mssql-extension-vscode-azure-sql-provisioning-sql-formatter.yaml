    | [PowerShell](scripts/create-and-configure-database-powershell?view=azuresql)
    | [PowerShell](../managed-instance/scripts/create-configure-managed-instance-powershell?view=azuresql)
    |

    | Configure | [Server-level IP firewall rule](firewall-create-server-level-portal-quickstart?view=azuresql))
    | [Connectivity from a virtual machine (VM)](../managed-instance/connect-vm-instance-configure?view=azuresql)
    |

    | [Connectivity from on-premises](../managed-instance/point-to-site-p2s-configure?view=azuresql)
