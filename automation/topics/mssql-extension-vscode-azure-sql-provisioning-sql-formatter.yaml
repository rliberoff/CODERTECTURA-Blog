notes: This is a highly actionable developer-tools update that removes friction from
  the SQL workflow right inside VS Code. It is especially relevant for application
  developers who want to go from local prototypes to Azure SQL with fewer context
  switches.
area: Azure data platform
code_example_ideas:
- Use the MSSQL extension in VS Code to provision a new Azure SQL Database free-tier
  instance from the editor.
- Apply the new SQL Formatter to an existing T-SQL script and compare formatted output
  in source control.
- Connect to Azure SQL Database from VS Code, run queries, and save shortcuts for
  repeated tasks.
