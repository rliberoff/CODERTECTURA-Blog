    # Quickstart: Use Visual Studio Code to connect and query Azure SQL Database or
    Azure SQL Managed Instance

    **Applies to:** ![](../media/applies-to/yes-icon.svg?view=azuresql) [Azure SQL
    Database](/en-us/sql/sql-server/sql-docs-navigation-guide#applies-to) ![](../media/applies-to/yes-icon.svg?view=azuresql)
    [Azure SQL Managed Instance](/en-us/sql/sql-server/sql-docs-navigation-guide#applies-to)

    [Visual Studio Code](https://code.visualstudio.com/docs) is a graphical code editor
    for Linux, macOS, and Windows. It supports extensions, including the [mssql extension](https://aka.ms/mssql-marketplace)
    for querying SQL Server, Azure SQL Database, Azure SQL Managed Instance, [SQL
    database in Microsoft Fabric](/en-us/fabric/database/sql/connect), and other platforms.
    In this quickstart, you use Visual Studio Code to connect to Azure SQL Database
    or Azure SQL Managed Instance and then run Transact-SQL statements to query, insert,
    update, and delete data.

    ## Prerequisites

    * A database in Azure SQL Database or Azure SQL Managed Instance. You can use
    one of these quickstarts to create and then configure a database in Azure SQL
    Database:

