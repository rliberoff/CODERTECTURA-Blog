  excerpt: 'Credentials covered by this guidance Subscription keys Named values that
    contain secrets Backend credentials (headers, query parameters, client certificates)
    OAuth 2.0 and OpenID Connect client secrets Connection strings (for example, Event
    Hubs loggers) Credentials written directly into policies How to rotate safely
    Use this order when both credentials can remain valid: Create a new secret where
    it is issued. Update API Management with the new secret. Test your APIs. Revoke
    the old secret. Important: Rotate each credential where it is issued (for example,
    the backend service or identity provider), not only in API Management. Updating
    the value in API Management alone does not invalidate the old credential. Find
    your instances and credentials Step 1: List your API Management instances In the
    Azure portal, search for API Management services, or use Azure CLI: In one subscription:
    az apim list --subscription {subscriptionId} --query "[].{name:name, resourceGroup:resourceGroup}"
    --output table Across accessible subscriptions (one Azure Resource Graph page):
    az graph query -q "resources | where type =~ ''microsoft.apimanagement/service''
    | project name, resourceGroup, subscriptionId, location" Step 2: List the credentials
    in each instance In the commands, replace {base} with https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{apimName}
    , and the other values in braces with your own. In policies, look for values such
    as Authorization headers, keys, passwords, tokens or connection strings written
    out in full instead of referenced as a named value. Subscription keys are under
    APIs > Subscriptions in the Azure portal. az rest --method get --url "{base}/subscriptions?api-version=2024-05-01"
    Named values are under APIs > Named values. The Type column shows whether each
    secret is stored in API Management or in Key Vault. az apim nv list --resource-group
    {rg} --service-name {apimName} --output table Backend credentials are under APIs
    > Backends > Authorization credentials. az rest --method get --url "{base}/backends?api-version=2024-05-01"
    OAuth 2.0 and OpenID Connect providers are under Developer portal > OAuth 2.0
    + OpenID Connect. Developer portal sign-in providers are under Developer portal
    > Identities. az rest --method get --url "{base}/authorizationServers?api-version=2024-05-01"
    az rest --method get --url "{base}/openidConnectProviders?api-version=2024-05-01"
    az rest --method get --url "{base}/identityProviders?api-version=2024-05-01" List
    providers under APIs > Credential manager: az rest --method get --url "{base}/authorizationProviders?api-version=2024-05-01"
    Loggers that use connection strings (Event Hubs, Application Insights): az rest
    --method get --url "{base}/loggers?api-version=2024-05-01" Check global, API,
    and operation policies under Design. For product policies, select Products > the
    product > Policies. az rest --method get --url "{base}/policies/policy?format=rawxml&ap…'
