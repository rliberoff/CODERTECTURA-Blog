notes: This is a practical guide to secret rotation in APIM, focusing on the order
  of operations that avoids outages. It is useful for teams managing backends, named
  values, OAuth clients, and connection strings in production.
area: integration and messaging
code_example_ideas:
- List API Management instances and inspect named values that store secrets with Azure
  CLI or the management API.
- Update backend credentials and validate the API path before revoking the old secret.
- Use a backend rotation runbook that rotates the secret at the issuer, then updates
  APIM and tests the endpoint.
