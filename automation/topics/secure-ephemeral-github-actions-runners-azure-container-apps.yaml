    # Automatically upgrade the Azure Connected Machine agent

    The Azure Connected Machine agent is updated regularly with bug fixes, stability
    improvements, and new functionality. Automatic agent upgrade helps keep Azure
    Arc-enabled servers up to date without requiring you to manually deploy each new
    agent version.

    When you enable automatic agent upgrade, Microsoft automatically manages updates
    to the Azure Connected Machine agent. Machines are scheduled to upgrade to the
    latest agent version. Upgrades roll out in batches across regions and initiate
    during off-peak hours to help maintain stability and minimize disruption. If an
    upgrade doesn''t complete successfully, the agent periodically retries the upgrade
    until it succeeds.

    Installing or upgrading the Azure Connected Machine agent doesn''t require a server
    restart. This feature is currently available only on Azure public cloud.

    ## Prerequisites

    Before enabling automatic agent upgrade, ensure your machines meet the following
    requirements:

    * **All Arc-enabled servers:** Azure Connected Machine agent version 1.67 or later
    is required.

    * **Windows:** Set the PowerShell execution policy to RemoteSigned. Automatic
    agent upgrade isn''t supported when the execution policy is set to Restricted.

    * **Linux:** Ensure the cron service is installed and running. This service is
    required to schedule and perform automatic agent upgrades.

    Important

    If enabled on an agent version earlier than 1.67, use [one of the other methods](manage-agent#additional-agent-upgrade-methods)
    to upgrade the agent to a compatible version. Automatic Agent Upgrade can then
    manage all future upgrades.

    ## Enable automatic agent upgrade

    You can enable automatic agent upgrade when connecting a new machine to Azure
    Arc or enable it later for an existing Arc-enabled server.

    To enable automatic agent upgrade when connecting the machine, include the `--enable-automatic-upgrade`
    parameter with `azcmagent connect`.

    ```

    azcmagent connect \ --subscription-id "" \ --resource-group "" \ --location ""
    \ --enable-automatic-upgrade

    ```

    Alternatively, enable automatic agent upgrade during the machine onboarding process
    in the Azure portal by following these steps:

