  excerpt: 'A practical architecture using KEDA autoscaling, GitHub App authentication,
    private Key Vault access, Microsoft Container Registry, and GitHub OIDC Implementation
    guide and field learnings What this architecture delivers · A repository-scoped
    runner that exists only for one workflow · Automatic scale-from-zero with an Azure
    Container Apps Event Job and KEDA · GitHub App authentication instead of a personal
    access token · Private secret retrieval using a managed identity, private endpoint
    and private DNS · Secretless Azure deployment from workflows through GitHub OIDC
    · No customer-managed Azure Container Registry for the runner image This article
    focuses on the final event-driven architecture and the implementation decisions
    that made it secure, repeatable and useful for real infrastructure workflows.
    Why this pattern? GitHub-hosted runners are the simplest option for many teams,
    but some workflows need private network access, organization-approved tooling
    or tighter control over the execution boundary. Long-running self-hosted virtual
    machines solve those needs, but introduce patching, capacity planning and idle
    cost. Azure Container Apps Jobs provide a serverless execution boundary for finite
    tasks. With the KEDA GitHub runner scaler, an execution can start when a matching
    workflow is queued, register one ephemeral runner, process one job and terminate.
    Setting the minimum execution count to zero preserves scale-to-zero when the queue
    is empty. The important design work begins around that lifecycle: how the runner
    image is prepared, how GitHub is authenticated, where secrets are stored, how
    private access is enforced, and which identity is allowed to deploy Azure resources.
    Reference architecture Figure 1. End-to-end event-driven architecture and trust
    boundaries. A matching GitHub Actions workflow enters the queue. The KEDA github-runner
    scaler polls GitHub using GitHub App authentication and starts an Azure Container
    Apps Event Job when the queue length reaches the configured target. The event
    job pulls a Microsoft-maintained base image from Microsoft Container Registry.
    At startup, the container installs or verifies the required toolchain, obtains
    GitHub App material from a private Azure Key Vault, generates short-lived GitHub
    credentials and registers a repository-level ephemeral runner. The workflow executes
    on that runner. When Azure access is needed, the workflow obtains a GitHub OIDC
    token and exchanges it through a federated credential on a separate Microsoft
    Entra deployment identity. Azure RBAC limits that identity to the intended deployment
    scope. After one workflow, the runner exits and the Container Apps job completes.
    With no remaining matching work, the solution returns to zero executions. Secure
    authentication flow Figure 2. Private secret retrieval and short-lived GitHub
    token exchange. Queue detection: KEDA queries GitHub for jobs matching the configured
