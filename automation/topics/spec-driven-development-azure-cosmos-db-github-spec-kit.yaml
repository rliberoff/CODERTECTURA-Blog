    # Azure Cosmos DB for NoSQL best practices in GitHub Copilot for Visual Studio
    Code

    * Applies to: ✅ NoSQL

    [GitHub Copilot](https://github.com/features/copilot) in Visual Studio Code provides
    intelligent code suggestions, but those suggestions become even more powerful
    when they understand your specific database context. The [Azure Cosmos DB for
    Visual Studio Code extension](https://marketplace.visualstudio.com/items?itemName=ms-azuretools.vscode-cosmosdb)
    automatically installs the [Azure Cosmos DB Agent Kit](gen-ai/agent-kit), enabling
    context-aware AI assistance for your database development.

    When you connect to your Azure Cosmos DB account through the Visual Studio Code
    extension, it automatically installs the Agent Kit, which provides GitHub Copilot
    with expert-level Azure Cosmos DB best practices across data modeling, partition
    key design, query optimization, SDK usage, and more.

    ## Why context-aware AI matters

    AI coding assistants like GitHub Copilot are only as effective as the context
    they have. Without understanding how your application interacts with Azure Cosmos
    DB—such as partitioning strategies, indexing patterns, or query design—Copilot
    might generate suggestions that aren''t optimized for your database setup.

    With the Agent Kit automatically installed, Copilot gains immediate access to:

    * **Data modeling** best practices for structuring documents and relationships

    * **Partition key design** guidelines for choosing effective partition keys

    * **Query optimization** techniques to reduce RU consumption and improve performance

    * **SDK best practices** for proper client initialization, retry logic, and error
    handling

    * **Vector search and full-text search** patterns for AI-powered applications

    * **Indexing strategies** for efficient index policies

    * **Throughput and scaling** guidance for autoscale and capacity planning

    ## Prerequisites

    * [Visual Studio Code](https://code.visualstudio.com/) installed on your machine

    * [GitHub Copilot subscription](https://github.com/features/copilot) (individual,
    business, or enterprise)

    * An Azure Cosmos DB account (any API)

    * Azure subscription with appropriate permissions to access Cosmos DB resources

    ## Step 1: Install required extensions

    First, ensure you have both the Azure Cosmos DB extension and GitHub Copilot extension
    installed:

