    # Azure Cosmos DB Agent Kit for AI coding assistants

    * Applies to: ✅ NoSQL

    The Azure Cosmos DB Agent Kit ([AzureCosmosDB/cosmosdb-agent-kit](https://github.com/AzureCosmosDB/cosmosdb-agent-kit))
    is an open-source collection of skills that extends AI coding assistants with
    expert-level Azure Cosmos DB best practices. Built on the [Agent Skills](https://agentskills.io/)
    format, the kit works seamlessly with **GitHub Copilot**, **Claude Code**, **Gemini
    CLI**, and other Agent Skills-compatible tools.

    Install it with one command, and your AI pair programmer instantly knows production-ready
    Azure Cosmos DB patterns, optimization techniques, and best practices.

    Watch a short overview of the kit in this video: [Azure Cosmos DB Agent Kit overview](https://www.youtube.com/watch?v=GWid8x3i9Cc&t=0s).

    ## The challenge

    When building applications with Azure Cosmos DB, developers often face critical
    decisions:

    * **Partition key selection**: Which key ensures high cardinality and supports
    query patterns?

    * **Query optimization**: Why is this query consuming so many RUs?

    * **Data modeling**: Should data be embedded or referenced?

    * **Hot partition prevention**: How do you avoid bottlenecks in production?

    Poor decisions in these areas can lead to performance problems, scalability problems,
    or unexpectedly high costs. The Agent Kit solves this problem by teaching your
    AI coding assistant the answers.

    ## What''s included

    The Agent Kit includes **111 curated rules** across **12 categories**, each prioritized
    by real-world effect:

    | Category | Priority | Description |

    | --- | --- | --- |

    | **Data Modeling** | Critical | Best practices for structuring documents and
    relationships |

    | **Partition Key Design** | Critical | Guidelines for choosing effective partition
    keys |

    | **Query Optimization** | High | Techniques to reduce RU consumption and improve
    performance |

    | **SDK Best Practices** | High | Proper client initialization, retry logic, and
    error handling |

    | **Design Patterns** | High | LangGraph routing, change-feed materialized views,
    efficient ranking |

    | **Vector Search** | High | Vector embedding policies, index types, and similarity
    queries |

    | **Full-Text Search** | High | Full-text indexing, BM25 ranking, and hybrid search
    patterns |

    | **Indexing Strategies** | Medium-High | Efficient index policies for your workloads
    |

