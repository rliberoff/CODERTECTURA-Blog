    # Storm-3168: Agentic-driven cloud attacks using compromised service principals

    ## Listen to this post

    ## Share

    ## Content types

    ## Products and services

    ## Topics

    Microsoft Security Research has identified malicious cloud activity associated
    with JADEPUFFER, a threat actor discovered by Sysdig in July 2026 and reported
    to be the first documented agentic ransomware operation. Our investigation found
    an extensive Azure-focused resource destruction activity using compromised service
    principals and cloud credential collection that could be used to facilitate future
    exfiltration.

    These findings expand the publicly documented activity associated with JADEPUFFER,
    tracked by Microsoft as Storm-3168, demonstrating an evolution in the threat actor’s
    cloud operations and providing the first detailed view into its Azure activity.
    We identified bulk destructive operations in a compromised Azure environment.
    The destructive operations were facilitated by compromising service principals
    and targeted Azure Storage Accounts, SQL databases, Key Vaults, Function Apps,
    recovery protection locks, Virtual Machines, and App Services.

    Organizations can reduce exposure by protecting workload identities and secrets,
    enforcing least privilege, safeguarding recovery resources, and enabling relevant
    [Microsoft Defender for Cloud](https://learn.microsoft.com/azure/defender-for-cloud/defender-for-cloud-introduction)
    protections. Publicly exposed credentials remain usable until revoked or rotated;
    removing the original disclosure alone does not remediate the exposure.

    This activity highlights a broader shift toward AI-orchestrated attacks, where
    threat actors can coordinate complex post-compromise operations across cloud environments
    with greater speed and scale. As these capabilities evolve, defenders must similarly
    use AI to investigate and respond across large environments. Rather than requiring
    analysts to manually follow each individual action, efforts such as [Project Perception](https://www.microsoft.com/en-us/security/business/ai-powered-cybersecurity/project-perception-agentic-system)
    and [MDASH](https://learn.microsoft.com/en-us/security-exposure-management/ai-code-security-overview)
    are intended to support a model in which defenders can investigate and respond
    across increasingly large and complex environments using AI.

