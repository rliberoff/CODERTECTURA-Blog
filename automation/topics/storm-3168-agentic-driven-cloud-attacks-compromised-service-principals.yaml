notes: A timely security post for architects and identity teams because it connects
  modern cloud tradecraft with the realities of service principal governance. The
  story is useful both for incident readiness and for hardening automation identities.
area: Identity and access
code_example_ideas:
- Audit service principals and application credentials used in automation for over-privileged
  access.
- Review Entra ID sign-in and audit logs for suspicious service principal activity
  and resource deletion patterns.
- Build a defensive checklist for least privilege, credential rotation and conditional
  access around non-human identities.
