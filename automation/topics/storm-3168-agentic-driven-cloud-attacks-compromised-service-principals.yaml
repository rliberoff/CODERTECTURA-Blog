    # Unmasking EvilTokens: Getting to the root of device code phishing

    ## Listen to this post

    ## Share

    ## Tags

    ## Threats intelligence

    ## Content types

    ## Products and services

    ## Topics

    Following its emergence in February 2026, EvilTokens quickly became one of the
    most widely used phishing-as-a-service (PhaaS) platforms, providing cybercriminals
    with AI capabilities for tailoring phishing lures and analyzing compromised inboxes
    to identify high-value targets. This AI-powered cybercrime platform facilitated
    sophisticated business email compromise (BEC) campaigns that compromised more
    than 12,000 inboxes in over 10,000 organizations worldwide.

    EvilTokens enabled threat actors to abuse the device code authentication flow,
    steal tokens, and compromise organizational accounts at scale using an AI-driven
    infrastructure and automating multiple parts of the attack chain. The toolkit
    offered a plethora of prebuilt phishing templates and landing pages with an AI-powered
    assistant to aid in structuring target-specific emails.

    Stolen tokens are used for email exfiltration and persistence, often through the
    creation of malicious inbox rules that conceal communications. In some cases,
    tokens can also be used to grant new devices access to a victim’s inbox, a particularly
    durable method to maintain persistence. Microsoft Threat Intelligence tracks the
    threat actor behind the development and support of the EvilTokens phish kit as
    Storm-2992.

    Post-compromise, EvilTokens enabled threat actors to utilize AI assistants to
    sift through victim mailbox activity and engineer a phishing message based on
    the accessible email content. EvilTokens also allowed threat actors to conduct
    Microsoft Graph reconnaissance to map organizational structure and permissions,
    enabling continued access and potential lateral movement while tokens remain valid.
    While token-targeting phishing is not new, it has become far more common and industrialized
    over the last several years as organizations adopted multifactor authentication
    (MFA).

    To evade detection, EvilTokens uses a multi-stage delivery pipeline designed to
    bypass traditional email gateways and endpoint security. Targets are lured through
    deceptive emails that use 44 different themes, including invoices and request
    for proposals (RFPs), or shared files. These emails contained malicious URLs,
    PDF attachments, and HTML files.

