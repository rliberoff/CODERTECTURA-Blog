    # From guidance to action: Security fundamentals that materially reduce risk

    ## Listen to this post

    ## Share

    ## Content types

    ## Topics

    AI has already made fundamental changes to the operating environment for cybersecurity.
    Cyberattackers are testing more paths, adapting their techniques, and moving across
    digital environments with greater speed and persistence. The weaknesses they exploit
    remain familiar: excessive permissions, unprotected authentication flows, unpatched
    systems, exposed execution paths, and gaps between controls. What has changed
    is how quickly these weaknesses can combine into attack paths that cross identities,
    endpoints, applications, networks, and AI systems. A single foothold can become
    a broader compromise, making it increasingly difficult for security teams to determine
    which risks matter most and where to act first as their organizations adopt AI.

    We introduced [Secure Now](https://aka.ms/securenow) within [Microsoft Security
    Exposure Management](https://www.microsoft.com/en-us/security/business/siem-and-xdr/microsoft-security-exposure-management)
    in May 2026 to help practitioners prioritize the action they need to take to be
    prepared for this shift. It provides actionable guidance for strengthening the
    foundational security needed for AI adoption, with recommendations focused on
    areas where autonomous attacks can create outsized exposure.

    We continue to see evidence that AI is reshaping the threat landscape. These developments
    reinforce many of the foundational practices we use internally to secure Microsoft,
    while also expanding our understanding of where organizations need additional
    visibility, governance, and control. The examples in this blog illustrate how
    familiar weaknesses are evolving in the AI era and why continuous exposure reduction
    remains essential.

    ## When AI agents test their boundaries

    Recent frontier model-related agentic security disclosures offered early lessons
    in how autonomous agents may test the boundaries of their instructions and environments.

    In [an incident disclosed by OpenAI](https://openai.com/index/hugging-face-incident-and-the-road-ahead/),
    agents moved beyond their intended isolation, exploited vulnerabilities in shared
    Hugging Face infrastructure, and reached production systems. In [separate incidents
    disclosed by Anthropic](https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals),
    agents exploited familiar weaknesses, including SQL injection, exposed credentials,
    weak passwords, and a malicious PyPI package.

